an x="800" dy="0">Loading, no events, no matching events,</tspan><tspan x="800" dy="22">and failed refresh need distinct</tspan><tspan x="800" dy="22">feedback.</tspan></text><text x="800" y="1016" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Additional filters remain visible as</tspan><tspan x="800" dy="22">removable chips.</tspan></text><a href="../atlas.html#screen=webhooks" aria-label="Apply filters - view prototype state" tabindex="0"><title>Apply filters - view prototype state</title><rect x="116" y="1102" width="144.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="136" y="1131" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="136" dy="0">Apply filters</tspan></text></a><a href="../atlas.html#screen=webhook-detail" aria-label="View event - view prototype state" tabindex="0"><title>View event - view prototype state</title><rect x="272.0" y="1102" width="130" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="292.0" y="1131" fill="#345EAD" font-size="15" font-weight="600"><tspan x="292.0" dy="0">View event</tspan></text></a><a href="../atlas.html#screen=webhooks" aria-label="Refresh - view prototype state" tabindex="0"><title>Refresh - view prototype state</title><rect x="414.0" y="1102" width="130" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="434.0" y="1131" fill="#345EAD" font-size="15" font-weight="600"><tspan x="434.0" dy="0">Refresh</tspan></text></a><a href="../atlas.html#screen=comments" aria-label="Comments - view prototype state" tabindex="0"><title>Comments - view prototype state</title><rect x="556.0" y="1102" width="130" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="576.0" y="1131" fill="#345EAD" font-size="15" font-weight="600"><tspan x="576.0" dy="0">Comments</tspan></text></a><text x="116" y="1182" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STA