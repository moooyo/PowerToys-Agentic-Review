<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="976" viewBox="0 0 1200 976" role="group" aria-label="Repository settings changed" style="font-family:Segoe UI,Arial,sans-serif"><title>Repository settings changed</title><desc>A version conflict keeps the local settings draft visible and disables saving until the latest saved settings are loaded.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1200" height="976" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><rect x="0" y="0" width="84" height="976" rx="0" fill="#F3F4FA" stroke="#F3F4FA"/><rect x="18" y="20" width="48" height="48" rx="16" fill="#345EAD" stroke="#345EAD"/><text x="29" y="50" fill="#FFFFFF" font-size="19" font-weight="600"><tspan x="29" dy="0">AR</tspan></text><a href="../atlas.html#screen=pull-requests" aria-label="Review" tabindex="0"><title>Review</title><rect x="12" y="102" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="127" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">R</tspan></text><text x="24" y="150" fill="#505966" font-size="11" font-weight="400"><tspan x="24" dy="0">Review</tspan></text></a><a href="../atlas.html#screen=tasks" aria-label="Tasks" tabindex="0"><title>Tasks</title><rect x="12" y="187" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="212" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">T</tspan></text><text x="27" y="235" fill="#505966" font-size="11" font-weight="400"><tspan x="27" dy="0">Tasks</tspan></text></a><a href="../atlas.html#screen=comments" aria-label="Activity" tabindex="0"><title>Activity</title><rect x="12" y="272" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="297" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">A</tspan></text><text x="18" y="320" fill="#505966" font-size="11" font-weight="400"><tspan x="18" dy="0">Activity</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Workspace" tabindex="0"><title>Workspace</title><rect x="12" y="357" width="60" height="62" rx="18" fill="#DFE6F4" stroke="#F3F4FA"/><text x="35" y="382" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">W</tspan></text><text x="15" y="405" fill="#505966" font-size="11" font-weight="400"><tspan x="15" dy="0">Workspace</tspan></text></a><rect x="84" y="0" width="1116" height="76" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="116" y="32" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="116" dy="0">Agentic Review</tspan></text><text x="116" y="55" fill="#505966" font-size="13" font-weight="400"><tspan x="116" dy="0">Review workspace</tspan></text><rect x="455" y="17" width="354" height="42" rx="22" fill="#F3F4FA" stroke="#D4DAE5"/><text x="473" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="473" dy="0">Repository / Illustrative scope</tspan></text><text x="886" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="886" dy="0">Search</tspan></text><a href="../atlas.html#screen=account" aria-label="My account" tabindex="0"><title>My account</title><rect x="1098" y="17" width="46" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="1110" y="43" fill="#173D79" font-size="15" font-weight="600"><tspan x="1110" dy="0">RV</tspan></text></a><text x="116" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="116" dy="0">WORKSPACE / repository-conflict</tspan></text><text x="116" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="116" dy="0">Repository settings changed</tspan></text><rect x="116" y="172" width="151.2" height="30" rx="15" fill="#FFF0D4" stroke="#FFF0D4"/><text x="130" y="192" fill="#775000" font-size="13" font-weight="600"><tspan x="130" dy="0">Version conflict</tspan></text><rect x="116" y="222" width="1052" height="42" rx="10" fill="#F3F4FA" stroke="#F3F4FA"/><text x="132" y="249" fill="#505966" font-size="14" font-weight="400"><tspan x="132" dy="0">Overview</tspan></text><text x="230" y="249" fill="#345EAD" font-size="14" font-weight="600"><tspan x="230" dy="0">Intake</tspan></text><rect x="226" y="261" width="66" height="3" rx="1" fill="#345EAD" stroke="#345EAD"/><text x="320" y="249" fill="#505966" font-size="14" font-weight="400"><tspan x="320" dy="0">Replies</tspan></text><rect x="116" y="284" width="1052" height="176" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="284" width="5" height="176" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="136" y="314" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Conflict notice</tspan></text><text x="136" y="344" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Settings changed. Your draft is kept.</tspan></text><text x="136" y="382" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Reload saved settings to replace the draft with the latest version.</tspan></text><text x="136" y="420" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Make the intended changes again after reviewing the new values.</tspan></text><rect x="116" y="476" width="1052" height="176" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="476" width="5" height="176" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="506" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Available choices</tspan></text><text x="136" y="536" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Download draft preserves a local reference to the current edits.</tspan></text><text x="136" y="574" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Reload uses the navigation guard before replacing dirty values.</tspan></text><text x="136" y="612" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">There is no silent overwrite or automatic field merge.</tspan></text><rect x="116" y="668" width="1052" height="176" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="668" width="5" height="176" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="698" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Review boundary</tspan></text><text x="136" y="728" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">This screen illustrates a possible response to a save attempt.</tspan></text><text x="136" y="766" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">The wireframe has not submitted a save or detected a live conflict.</tspan></text><text x="136" y="804" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Account conflicts use a separate latest-version review flow.</tspan></text><a href="../atlas.html#screen=unsaved-changes" aria-label="Review reload warning - view prototype state" tabindex="0"><title>Review reload warning - view prototype state</title><rect x="116" y="868" width="208.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="136" y="897" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="136" dy="0">Review reload warning</tspan></text></a><a href="../atlas.html#screen=repository-intake" aria-label="Inspect intake draft - view prototype state" tabindex="0"><title>Inspect intake draft - view prototype state</title><rect x="336.0" y="868" width="200.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="356.0" y="897" fill="#345EAD" font-size="15" font-weight="600"><tspan x="356.0" dy="0">Inspect intake draft</tspan></text></a><a href="../atlas.html#screen=repository-replies" aria-label="Inspect reply settings - view prototype state" tabindex="0"><title>Inspect reply settings - view prototype state</title><rect x="548.0" y="868" width="216.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="568.0" y="897" fill="#345EAD" font-size="15" font-weight="600"><tspan x="568.0" dy="0">Inspect reply settings</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Back to repositories - view prototype state" tabindex="0"><title>Back to repositories - view prototype state</title><rect x="776.0" y="868" width="200.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="796.0" y="897" fill="#345EAD" font-size="15" font-weight="600"><tspan x="796.0" dy="0">Back to repositories</tspan></text></a><text x="116" y="948" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>