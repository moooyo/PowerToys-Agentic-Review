<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="group" aria-label="Report reader" style="font-family:Segoe UI,Arial,sans-serif"><title>Report reader</title><desc>Illustrative saved report. Finding text and counts are explanatory examples, not exported report contents.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1200" height="740" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><rect x="0" y="0" width="84" height="740" rx="0" fill="#F3F4FA" stroke="#F3F4FA"/><rect x="18" y="20" width="48" height="48" rx="16" fill="#345EAD" stroke="#345EAD"/><text x="29" y="50" fill="#FFFFFF" font-size="19" font-weight="600"><tspan x="29" dy="0">AR</tspan></text><a href="../atlas.html#screen=pull-requests" aria-label="Review" tabindex="0"><title>Review</title><rect x="12" y="102" width="60" height="62" rx="18" fill="#DFE6F4" stroke="#F3F4FA"/><text x="35" y="127" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">R</tspan></text><text x="24" y="150" fill="#505966" font-size="11" font-weight="400"><tspan x="24" dy="0">Review</tspan></text></a><a href="../atlas.html#screen=tasks" aria-label="Tasks" tabindex="0"><title>Tasks</title><rect x="12" y="187" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="212" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">T</tspan></text><text x="27" y="235" fill="#505966" font-size="11" font-weight="400"><tspan x="27" dy="0">Tasks</tspan></text></a><a href="../atlas.html#screen=comments" aria-label="Activity" tabindex="0"><title>Activity</title><rect x="12" y="272" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="297" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">A</tspan></text><text x="18" y="320" fill="#505966" font-size="11" font-weight="400"><tspan x="18" dy="0">Activity</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Workspace" tabindex="0"><title>Workspace</title><rect x="12" y="357" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="382" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">W</tspan></text><text x="15" y="405" fill="#505966" font-size="11" font-weight="400"><tspan x="15" dy="0">Workspace</tspan></text></a><rect x="84" y="0" width="1116" height="76" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="116" y="32" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="116" dy="0">Agentic Review</tspan></text><text x="116" y="55" fill="#505966" font-size="13" font-weight="400"><tspan x="116" dy="0">Review workspace</tspan></text><rect x="455" y="17" width="354" height="42" rx="22" fill="#F3F4FA" stroke="#D4DAE5"/><text x="473" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="473" dy="0">Repository / Illustrative scope</tspan></text><text x="886" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="886" dy="0">Search</tspan></text><a href="../atlas.html#screen=account" aria-label="My account" tabindex="0"><title>My account</title><rect x="1098" y="17" width="46" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="1110" y="43" fill="#173D79" font-size="15" font-weight="600"><tspan x="1110" dy="0">RV</tspan></text></a><text x="116" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="116" dy="0">REVIEW / report-detail</tspan></text><text x="116" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="116" dy="0">Report reader</tspan></text><rect x="116" y="172" width="151.2" height="30" rx="15" fill="#FFF0D4" stroke="#FFF0D4"/><text x="130" y="192" fill="#775000" font-size="13" font-weight="600"><tspan x="130" dy="0">Saved assessment</tspan></text><rect x="116" y="222" width="1052" height="42" rx="10" fill="#F3F4FA" stroke="#F3F4FA"/><text x="132" y="249" fill="#345EAD" font-size="14" font-weight="600"><tspan x="132" dy="0">Findings</tspan></text><rect x="128" y="261" width="74" height="3" rx="1" fill="#345EAD" stroke="#345EAD"/><text x="230" y="249" fill="#505966" font-size="14" font-weight="400"><tspan x="230" dy="0">Evidence</tspan></text><text x="328" y="249" fill="#505966" font-size="14" font-weight="400"><tspan x="328" dy="0">Details</tspan></text><rect x="116" y="284" width="300" height="204" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="284" width="5" height="204" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="314" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Conclusion and next step</tspan></text><text x="136" y="344" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Saved outcome first;</tspan><tspan x="136" dy="22">validation and completeness</tspan><tspan x="136" dy="22">stay visible.</tspan></text><text x="136" y="426" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Recommended action uses fresh</tspan><tspan x="136" dy="22">server context.</tspan></text><rect x="436" y="284" width="732" height="138" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="436" y="284" width="5" height="138" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="456" y="314" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="456" dy="0">Finding reader</tspan></text><text x="456" y="344" fill="#505966" font-size="15" font-weight="400"><tspan x="456" dy="0">Full-report search, priority, and assessment filters.</tspan></text><text x="456" y="382" fill="#505966" font-size="15" font-weight="400"><tspan x="456" dy="0">Selected findings persist across pages and filters.</tspan></text><rect x="436" y="438" width="732" height="138" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="436" y="438" width="5" height="138" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="456" y="468" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="456" dy="0">Feedback draft</tspan></text><text x="456" y="498" fill="#505966" font-size="15" font-weight="400"><tspan x="456" dy="0">Edit current feedback; save it and continue reading.</tspan></text><text x="456" y="536" fill="#505966" font-size="15" font-weight="400"><tspan x="456" dy="0">Review the complete selected set before publication.</tspan></text><a href="../atlas.html#screen=publication-select" aria-label="Publish selected - view prototype state" tabindex="0"><title>Publish selected - view prototype state</title><rect x="116" y="600" width="168.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="136" y="629" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="136" dy="0">Publish selected</tspan></text></a><a href="../atlas.html#screen=p0-guard" aria-label="Inspect P0 case - view prototype state" tabindex="0"><title>Inspect P0 case - view prototype state</title><rect x="296.0" y="600" width="160.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="316.0" y="629" fill="#345EAD" font-size="15" font-weight="600"><tspan x="316.0" dy="0">Inspect P0 case</tspan></text></a><a href="../atlas.html#screen=followup" aria-label="Inspect follow-up - view prototype state" tabindex="0"><title>Inspect follow-up - view prototype state</title><rect x="468.0" y="600" width="176.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="488.0" y="629" fill="#345EAD" font-size="15" font-weight="600"><tspan x="488.0" dy="0">Inspect follow-up</tspan></text></a><a href="../atlas.html#screen=reports" aria-label="Back to reports - view prototype state" tabindex="0"><title>Back to reports - view prototype state</title><rect x="656.0" y="600" width="160.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="676.0" y="629" fill="#345EAD" font-size="15" font-weight="600"><tspan x="676.0" dy="0">Back to reports</tspan></text></a><text x="116" y="680" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED