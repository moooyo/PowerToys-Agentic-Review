<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="group" aria-label="Webhook event details" style="font-family:Segoe UI,Arial,sans-serif"><title>Webhook event details</title><desc>Keep the event outcome, failed phase, retained attempts, and related work visible before considering a recovery request.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1200" height="920" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><rect x="0" y="0" width="84" height="920" rx="0" fill="#F3F4FA" stroke="#F3F4FA"/><rect x="18" y="20" width="48" height="48" rx="16" fill="#345EAD" stroke="#345EAD"/><text x="29" y="50" fill="#FFFFFF" font-size="19" font-weight="600"><tspan x="29" dy="0">AR</tspan></text><a href="../atlas.html#screen=pull-requests" aria-label="Review" tabindex="0"><title>Review</title><rect x="12" y="102" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="127" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">R</tspan></text><text x="24" y="150" fill="#505966" font-size="11" font-weight="400"><tspan x="24" dy="0">Review</tspan></text></a><a href="../atlas.html#screen=tasks" aria-label="Tasks" tabindex="0"><title>Tasks</title><rect x="12" y="187" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="212" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">T</tspan></text><text x="27" y="235" fill="#505966" font-size="11" font-weight="400"><tspan x="27" dy="0">Tasks</tspan></text></a><a href="../atlas.html#screen=comments" aria-label="Activity" tabindex="0"><title>Activity</title><rect x="12" y="272" width="60" height="62" rx="18" fill="#DFE6F4" stroke="#F3F4FA"/><text x="35" y="297" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">A</tspan></text><text x="18" y="320" fill="#505966" font-size="11" font-weight="400"><tspan x="18" dy="0">Activity</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Workspace" tabindex="0"><title>Workspace</title><rect x="12" y="357" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="382" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">W</tspan></text><text x="15" y="405" fill="#505966" font-size="11" font-weight="400"><tspan x="15" dy="0">Workspace</tspan></text></a><rect x="84" y="0" width="1116" height="76" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="116" y="32" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="116" dy="0">Agentic Review</tspan></text><text x="116" y="55" fill="#505966" font-size="13" font-weight="400"><tspan x="116" dy="0">Review workspace</tspan></text><rect x="455" y="17" width="354" height="42" rx="22" fill="#F3F4FA" stroke="#D4DAE5"/><text x="473" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="473" dy="0">Repository / Illustrative scope</tspan></text><text x="886" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="886" dy="0">Search</tspan></text><a href="../atlas.html#screen=account" aria-label="My account" tabindex="0"><title>My account</title><rect x="1098" y="17" width="46" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="1110" y="43" fill="#173D79" font-size="15" font-weight="600"><tspan x="1110" dy="0">RV</tspan></text></a><text x="116" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="116" dy="0">ACTIVITY / webhook-detail</tspan></text><text x="116" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="116" dy="0">Webhook event details</tspan></text><rect x="116" y="172" width="205.1" height="30" rx="15" fill="#FCEAE9" stroke="#FCEAE9"/><text x="130" y="192" fill="#B3261E" font-size="13" font-weight="600"><tspan x="130" dy="0">Failed handling example</tspan></text><rect x="116" y="222" width="644" height="176" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="222" width="5" height="176" rx="2" fill="#FCEAE9" stroke="#FCEAE9"/><text x="136" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Recorded outcome</tspan></text><text x="136" y="282" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Target: sample pull request; mode: static review</tspan></text><text x="136" y="320" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Failed phase: source import</tspan></text><text x="136" y="358" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">A specific failure reason is shown independently from any task status.</tspan></text><rect x="780" y="222" width="388" height="286" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="780" y="222" width="5" height="286" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="800" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="800" dy="0">Handling timeline</tspan></text><text x="800" y="282" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Authorization, source import, task</tspan><tspan x="800" dy="22">creation, and recovery retain separate</tspan><tspan x="800" dy="22">entries.</tspan></text><text x="800" y="364" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Retry scheduled, failed, ignored, and</tspan><tspan x="800" dy="22">interrupted are distinct outcomes.</tspan></text><text x="800" y="424" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Event details retain delivery,</tspan><tspan x="800" dy="22">repository, trigger, and receipt</tspan><tspan x="800" dy="22">context.</tspan></text><rect x="780" y="524" width="388" height="264" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="780" y="524" width="5" height="264" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="800" y="554" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="800" dy="0">Recovery boundary</tspan></text><text x="800" y="584" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Retry event opens a preview of the</tspan><tspan x="800" dy="22">current event before confirmation.</tspan></text><text x="800" y="644" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Repository management and task-creation</tspan><tspan x="800" dy="22">grants are required; E2E also requires</tspan><tspan x="800" dy="22">execution access.</tspan></text><text x="800" y="726" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Refresh does not clear an unknown</tspan><tspan x="800" dy="22">recovery acknowledgement.</tspan></text><a href="../atlas.html#screen=webhooks" aria-label="Back to events - view prototype state" tabindex="0"><title>Back to events - view prototype state</title><rect x="116" y="812" width="152.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="136" y="841" fill="#345EAD" font-size="15" font-weight="600"><tspan x="136" dy="0">Back to events</tspan></text></a><a href="../atlas.html#screen=webhook-detail" aria-label="Refresh event - view prototype state" tabindex="0"><title>Refresh event - view prototype state</title><rect x="280.0" y="812" width="144.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="300.0" y="841" fill="#345EAD" font-size="15" font-weight="600"><tspan x="300.0" dy="0">Refresh event</tspan></text></a><a href="../atlas.html#screen=task-detail" aria-label="Inspect related task - view prototype state" tabindex="0"><title>Inspect related task - view prototype state</title><rect x="436.0" y="812" width="200.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="456.0" y="841" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="456.0" dy="0">Inspect related task</tspan></text></a><a href="../atlas.html#screen=repository-intake" aria-label="Review intake settings - view prototype state" tabindex="0"><title>Review intake settings - view prototype state</title><rect x="648.0" y="812" width="216.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="668.0" y="841" fill="#345EAD" font-size="15" font-weight="600"><tspan x="668.0" dy="0">Review intake settings</tspan></text></a><text x="116" y="892" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>