stroke="#FFF0D4"/><text x="250" y="192" fill="#775000" font-size="13" font-weight="600"><tspan x="250" dy="0">Local draft guard</tspan></text><rect x="236" y="222" width="846" height="176" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="236" y="222" width="5" height="176" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="256" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="256" dy="0">Dirty draft</tspan></text><text x="256" y="282" fill="#505966" font-size="15" font-weight="400"><tspan x="256" dy="0">Your unsaved edits will be lost.</tspan></text><text x="256" y="320" fill="#505966" font-size="15" font-weight="400"><tspan x="256" dy="0">Submitted requests and their saved outcomes remain available.</tspan></text><text x="256" y="358" fill="#505966" font-size="15" font-weight="400"><tspan x="256" dy="0">Keep editing preserves the current local form.</tspan></text><rect x="236" y="414" width="846" height="176" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="236" y="414" width="5" height="176" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="256" y="444" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="256" dy="0">Busy variant</tspan></text><text x="256" y="474" fill="#505966" font-size="15" font-weight="400"><tspan x="256" dy="0">Title: An operation is still in progress</tspan></text><text x="256" y="512" fill="#505966" font-size="15" font-weight="400"><tspan x="256" dy="0">Wait for its result before leaving this view.</tspan></text><text x="256" y="550" fill="#505966" font-size="15" font-weight="400"><tspan x="256" dy="0">Discard is unavailable while an active operation is busy.</tspan></text><rect x="236" y="606" width="846" height="176" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="236" y="606" width="5" height="176" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="256" y="636" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="256" dy="0">Prototype example</tspan></text><text x="256" y="666" fill="#505966" font-size="15" font-weight="400"><tspan x="256" dy="0">This example starts in Repository intake.</tspan></text><text x="256" y="704" fill="#505966" font-size="15" font-weight="400"><tspan x="256" dy="0">Discard changes opens the repository directory wireframe.</tspan></text><text x="256" y="742" fill="#505966" font-size="15" font-weight="400"><tspan x="256" dy="0">No actual draft, request, or server operation is removed.</tspan></text><a href="../atlas.html#screen=repository-intake" aria-label="Keep editing - view prototype state" tabindex="0"><title>Keep editing - view prototype state</title><rect x="236" y="806" width="136.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="256" y="835" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="256" dy="0">Keep editing</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Discard changes - view prototype state" tabindex="0"><title>Discard changes - view prototype state</title><rect x="384.0" y="806" width="160.0" height="46" rx="23" fill="#FCEAE9" stroke="#737D8C"/><text x="404.0" y="835" fill="#B3261E" font-size="15" font-weight="600"><tspan x="404.0" dy="0">Discard changes</tspan></text></a><text x="236" y="886" fill="#505966" font-size="11" font-weight="400"><tspan x="236" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>