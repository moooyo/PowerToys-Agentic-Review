ont-weight="400"><tspan x="18" dy="0">Activity</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Workspace" tabindex="0"><title>Workspace</title><rect x="12" y="357" width="60" height="62" rx="18" fill="#DFE6F4" stroke="#F3F4FA"/><text x="35" y="382" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">W</tspan></text><text x="15" y="405" fill="#505966" font-size="11" font-weight="400"><tspan x="15" dy="0">Workspace</tspan></text></a><rect x="84" y="0" width="1116" height="76" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="116" y="32" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="116" dy="0">Agentic Review</tspan></text><text x="116" y="55" fill="#505966" font-size="13" font-weight="400"><tspan x="116" dy="0">Review workspace</tspan></text><rect x="455" y="17" width="354" height="42" rx="22" fill="#F3F4FA" stroke="#D4DAE5"/><text x="473" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="473" dy="0">Repository / Illustrative scope</tspan></text><text x="886" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="886" dy="0">Search</tspan></text><a href="../atlas.html#screen=account" aria-label="My account" tabindex="0"><title>My account</title><rect x="1098" y="17" width="46" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="1110" y="43" fill="#173D79" font-size="15" font-weight="600"><tspan x="1110" dy="0">RV</tspan></text></a><text x="116" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="116" dy="0">WORKSPACE / workers</tspan></text><text x="116" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="116" dy="0">Workers</tspan></text><rect x="116" y="172" width="182.0" height="30" rx="15" fill="#DCE6FF" stroke="#DCE6FF"/><text x="130" y="192" fill="#173D79" font-size="13" font-weight="600"><tspan x="130" dy="0">Administrator access</tspan></text><rect x="116" y="222" width="1052" height="42" rx="10" fill="#F3F4FA" stroke="#F3F4FA"/><text x="132" y="249" fill="#505966" font-size="14" font-weight="400"><tspan x="132" dy="0">Repositories</tspan></text><text x="262" y="249" fill="#345EAD" font-size="14" font-weight="600"><tspan x="262" dy="0">Workers</tspan></text><rect x="258" y="261" width="66" height="3" rx="1" fill="#345EAD" stroke="#345EAD"/><text x="352" y="249" fill="#505966" font-size="14" font-weight="400"><tspan x="352" dy="0">Accounts</tspan></text><rect x="116" y="284" width="1052" height="44" rx="8" fill="#EDF0F7" stroke="#D4DAE5"/><text x="132" y="312" fill="#505966" font-size="13" font-weight="600"><tspan x="132" dy="0">Worker</tspan></text><text x="542.28" y="312" fill="#505966" font-size="13" font-weight="600"><tspan x="542.28" dy="0">Contact</tspan></text><text x="756.1866666666666" y="312" fill="#505966" font-size="13" font-weight="600"><tspan x="756.1866666666666" dy="0">E2E work</tspan></text><text x="970.0933333333332" y="312" fill="#505966" font-size="13" font-weight="600"><tspan x="970.0933333333332" dy="0">Resources</tspan></text><a href="../atlas.html#screen=workers" aria-label="Open worker-demo-a" tabindex="0"><title>Open worker-demo-a</title><rect x="116" y="328" width="1052" height="66" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="132" y="354" fill="#173D79" font-size="15" font-weight="600"><tspan x="132" dy="0">worker-demo-a</tspan></text><text x="542.28" y="354" fill="#505966" font-size="15" font-weight="400"><tspan x="542.28" dy="0">Recent contact</tspan></text><text x="756.1866666666666" y="354" fill="#505966" font-size="15" font-weight="400"><tspan x="756.1866666666666" dy="0">Stopping</tspan></text><text x="970.0933333333332" y="354" fill="#505966" font-size="15" font-weight="400"><tspan x="970.0933333333332" dy="0">Cleanup pending</tspan></text></a><a href="../atlas.html#screen=workers" aria-label="Open worker-demo-b" tabindex="0"><title>Open worker-demo-b</title><rect x="116" y="394" width="1052" height="68" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="132" y="420" fill="#173D79" font-size="15" font-weight="600"><tspan x="132" dy="0">worker-demo-b</tspan></text><text x="542.28" y="420" fill="#505966" font-size="15" font-weight="400"><tspan x="542.28" dy="0">No recent contact</tspan></text><text x="756.1866666666666" y="420" fill="#505966" font-size="15" font-weight="400"><tspan x="756.1866666666666" dy="0">Awaiting confirmation</tspan></text><text x="970.0933333333332" y="420" fill="#505966" font-size="15" font-weight="400"><tspan x="970.0933333333332" dy="0">No confirmed</tspan><tspan x="970.0933333333332" dy="21">availability</tspan></text></a><a href="../atlas.html#screen=workers" aria-label="Open worker-demo-c" tabindex="0"><title>Open worker-demo-c</title><rect x="116" y="462" width="1052" height="66" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="132" y="488" fill="#173D79" font-size="15" font-weight="600"><tspan x="132" dy="0">worker-demo-c</tspan></text><text x="542.28" y="488" fill="#505966" font-size="15" font-weight="400"><tspan x="542.28" dy="0">Never contacted</tspan></text><text x="756.1866666666666" y="488" fill="#505966" font-size="15" font-weight="400"><tspan x="756.1866666666666" dy="0">Disabled</tspan></text><text x="970.0933333333332" y="488" fill="#505966" font-size="15" font-weight="400"><tspan x="970.0933333333332" dy="0">No reported ownership</tspan></text></a><rect x="116" y="552" width="644" height="198" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="552" width="5" height="198" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="582" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Worker detail</tspan></text><text x="136" y="612" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Advertised and effective task capabilities remain distinct.</tspan></text><text x="136" y="650" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Repository assignments and static resource ownership have their own</tspan><tspan x="136" dy="22">links.</tspan></text><text x="136" y="710" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Current E2E tasks and cleanup-pending attempts remain visible.</tspan></text><rect x="780" y="552" width="388" height="242" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="780" y="552" width="5" height="242" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="800" y="582" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="800" dy="0">Stop E2E work</tspan></text><text x="800" y="612" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">The product asks for confirmation before</tspan><tspan x="800" dy="22">stopping E2E work.</tspan></text><text x="800" y="672" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">New assignments stop; running work is</tspan><tspan x="800" dy="22">cancelled and cleaned up.</tspan></text><text x="800" y="732" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Resources remain reserved until the</tspan><tspan x="800" dy="22">worker confirms cleanup.</tspan></text><rect x="780" y="810" width="388" height="242" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="780" y="810" width="5" height="242" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="800" y="840" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="800" dy="0">Unconfirmed policy save</tspan></text><text x="800" y="870" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Refresh workers, then review the latest</tspan><tspan x="800" dy="22">saved policy before trying again.</tspan></text><text x="800" y="930" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">No recent contact does not prove that</tspan><tspan x="800" dy="22">owned resources are released.</tspan></text><text x="800" y="990" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">This wireframe cannot confirm cleanup or</tspan><tspan x="800" dy="22">resolve an unknown operation.</tspan></text><a href="../atlas.html#screen=workers" aria-label="Refresh workers - view prototype state" tabindex="0"><title>Refresh workers - view prototype state</title><rect x="116" y="1076" width="160.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="136" y="1105" fill="#345EAD" font-size="15" font-weight="600"><tspan x="136" dy="0">Refresh workers</tspan></text></a><a href="../atlas.html#screen=task-detail" aria-label="Inspect owned task - view prototype state" tabindex="0"><title>Inspect owned task - view prototype state</title><rect x="288.0" y="1076" width="184.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="308.0" y="1105" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="308.0" dy="0">Inspect owned task</tspan></text></a><a href="../atlas.html#screen=scheduling" aria-label="Workspace scheduling - view prototype state" tabindex="0"><title>Workspace scheduling - view prototype state</title><rect x="484.0" y="1076" width="200.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="504.0" y="1105" fill="#345EAD" font-size="15" font-weight="600"><tspan x="504.0" dy="0">Workspace scheduling</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Repositories - view prototype state" tabindex="0"><title>Repositories - view prototype state</title><rect x="696.0" y="1076" width="136.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="716.0" y="1105" fill="#345EAD" font-size="15" font-weight="600"><tspan x="716.0" dy="0">Repositories</tspan></text></a><text x="116" y="1156" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>