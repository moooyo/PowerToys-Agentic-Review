<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1004" viewBox="0 0 1200 1004" role="group" aria-label="Sign in" style="font-family:Segoe UI,Arial,sans-serif"><title>Sign in</title><desc>Password authentication gates the workspace. This wireframe uses synthetic values and does not establish a session.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1200" height="1004" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><text x="40" y="42" fill="#345EAD" font-size="20" font-weight="600"><tspan x="40" dy="0">Agentic Review</tspan></text><rect x="256" y="85" width="688" height="902" rx="24" fill="#FFFFFF" stroke="#D4DAE5"/><text x="280" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="280" dy="0">ACCESS / sign-in</tspan></text><text x="280" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="280" dy="0">Sign in</tspan></text><rect x="280" y="172" width="105.0" height="30" rx="15" fill="#DCE6FF" stroke="#DCE6FF"/><text x="294" y="192" fill="#173D79" font-size="13" font-weight="600"><tspan x="294" dy="0">Signed out</tspan></text><rect x="280" y="222" width="640" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="280" y="222" width="5" height="224" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="300" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="300" dy="0">Credentials</tspan></text><rect x="300" y="269" width="600" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="312" y="292" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="312" dy="0">Username: demo.reviewer</tspan></text><rect x="300" y="323" width="600" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="312" y="346" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="312" dy="0">Password: hidden; show or hide control</tspan></text><rect x="300" y="377" width="600" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="312" y="400" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="312" dy="0">Sign in is disabled while the request is pending.</tspan></text><rect x="280" y="462" width="640" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="280" y="462" width="5" height="224" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="300" y="492" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="300" dy="0">Field feedback</tspan></text><rect x="300" y="509" width="600" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="312" y="532" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="312" dy="0">Required fields retain stable labels.</tspan></text><rect x="300" y="563" width="600" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="312" y="586" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="312" dy="0">A failed sign-in shows an error above the form.</tspan></text><rect x="300" y="617" width="600" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="312" y="640" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="312" dy="0">Retry connection appears when a connection notice is present.</tspan></text><rect x="280" y="702" width="640" height="170" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="280" y="702" width="5" height="170" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="300" y="732" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="300" dy="0">Prototype navigation</tspan></text><rect x="300" y="749" width="600" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="312" y="772" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="312" dy="0">Sign in opens the signed-in wireframe only.</tspan></text><rect x="300" y="803" width="600" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="312" y="826" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="312" dy="0">No credential is sent and no account is changed.</tspan></text><a href="../atlas.html#screen=pull-requests" aria-label="Sign in - view prototype state" tabindex="0"><title>Sign in - view prototype state</title><rect x="280" y="896" width="130" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="300" y="925" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="300" dy="0">Sign in</tspan></text></a><a href="../atlas.html#screen=sign-in" aria-label="Retry connection - view prototype state" tabindex="0"><title>Retry connection - view prototype state</title><rect x="422" y="896" width="168.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="442" y="925" fill="#345EAD" font-size="15" font-weight="600"><tspan x="442" dy="0">Retry connection</tspan></text></a><a href="../atlas.html#screen=session-expired" aria-label="Review session expiry - view prototype state" tabindex="0"><title>Review session expiry - view prototype state</title><rect x="602.0" y="896" width="208.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="622.0" y="925" fill="#345EAD" font-size="15" font-weight="600"><tspan x="622.0" dy="0">Review session expiry</tspan></text></a><text x="280" y="976" fill="#505966" font-size="11" font-weight="400"><tspan x="280" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>