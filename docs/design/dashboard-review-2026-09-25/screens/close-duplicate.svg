th="1052" height="170" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="222" width="5" height="170" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Saved duplicate target</tspan></text><rect x="136" y="269" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="292" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Read-only target shows the retained identifier and issue number.</tspan></text><rect x="136" y="323" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="346" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">The target comes from the saved assessment.</tspan></text><rect x="116" y="408" width="1052" height="170" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="408" width="5" height="170" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="136" y="438" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Missing or unusable target</tspan></text><rect x="136" y="455" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="478" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Show No usable saved target and field-level guidance.</tspan></text><rect x="136" y="509" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="532" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Reload the report or choose another operation.</tspan></text><rect x="116" y="594" width="1052" height="170" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="594" width="5" height="170" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="624" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Review the exact effect</tspan></text><rect x="136" y="641" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="664" fill="#1B1D24" font-