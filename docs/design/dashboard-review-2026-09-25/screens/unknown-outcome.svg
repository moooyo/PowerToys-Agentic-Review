<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="group" aria-label="Unconfirmed action outcome" style="font-family:Segoe UI,Arial,sans-serif"><title>Unconfirmed action outcome</title><desc>Illustrative unknown action result. Checking an existing intent is separate from sending a new action.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><rect x="0" y="0" width="84" height="800" rx="0" fill="#F3F4FA" stroke="#F3F4FA"/><rect x="18" y="20" width="48" height="48" rx="16" fill="#345EAD" stroke="#345EAD"/><text x="29" y="50" fill="#FFFFFF" font-size="19" font-weight="600"><tspan x="29" dy="0">AR</tspan></text><a href="../atlas.html#screen=pull-requests" aria-label="Review" tabindex="0"><title>Review</title><rect x="12" y="102" width="60" height="62" rx="18" fill="#DFE6F4" stroke="#F3F4FA"/><text x="35" y="127" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">R</tspan></text><text x="24" y="150" fill="#505966" font-size="11" font-weight="400"><tspan x="24" dy="0">Review</tspan></text></a><a href="../atlas.html#screen=tasks" aria-label="Tasks" tabindex="0"><title>Tasks</title><rect x="12" y="187" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="212" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">T</tspan></text><text x="27" y="235" fill="#505966" font-size="11" font-weight="400"><tspan x="27" dy="0">Tasks</tspan></text></a><a href="../atlas.html#screen=comments" aria-label="Activity" tabindex="0"><title>Activity</title><rect x="12" y="272" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="297" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">A</tspan></text><text x="18" y="320" fill="#505966" font-size="11" font-weight="400"><tspan x="18" dy="0">Activity</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Workspace" tabindex="0"><title>Workspace</title><rect x="12" y="357" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="382" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">W</tspan></text><text x="15" y="405" fill="#505966" font-size="11" font-weight="400"><tspan x="15" dy="0">Workspace</tspan></text></a><rect x="84" y="0" width="1116" height="76" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="116" y="32" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="116" dy="0">Agentic Review</tspan></text><text x="116" y="55" fill="#505966" font-size="13" font-weight="400"><tspan x="116" dy="0">Review workspace</tspan></text><rect x="455" y="17" width="354" height="42" rx="22" fill="#F3F4FA" stroke="#D4DAE5"/><text x="473" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="473" dy="0">Repository / Illustrative scope</tspan></text><text x="886" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="886" dy="0">Search</tspan></text><a href="../atlas.html#screen=account" aria-label="My account" tabindex="0"><title>My account</title><rect x="1098" y="17" width="46" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="1110" y="43" fill="#173D79" font-size="15" font-weight="600"><tspan x="1110" dy="0">RV</tspan></text></a><text x="116" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="116" dy="0">PUBLICATION / unknown-outcome</tspan></text><text x="116" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="116" dy="0">Unconfirmed action outcome</tspan></text><rect x="116" y="172" width="189.70000000000002" height="30" rx="15" fill="#FFF0D4" stroke="#FFF0D4"/><text x="130" y="192" fill="#775000" font-size="13" font-weight="600"><tspan x="130" dy="0">Unknown / Keep intent</tspan></text><rect x="116" y="222" width="1052" height="138" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="222" width="5" height="138" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="136" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Keep the existing submission</tspan></text><text x="136" y="282" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">The outcome is unconfirmed; do not create a second intent.</tspan></text><text x="136" y="320" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Edits to a private draft do not alter the submitted payload.</tspan></text><rect x="116" y="376" width="1052" height="138" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="376" width="5" height="138" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="406" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Refresh status or check submission</tspan></text><text x="136" y="436" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">The owner can refresh the saved intent.</tspan></text><text x="136" y="474" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Reconciliation requires execution permission and capability.</tspan></text><rect x="116" y="530" width="1052" height="138" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="530" width="5" height="138" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="560" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Possible outcomes</tspan></text><text x="136" y="590" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">A known authoritative result becomes a receipt.</tspan></text><text x="136" y="628" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">If still unknown, preserve identity and keep this state.</tspan></text><a href="../atlas.html#screen=action-receipt" aria-label="Explore known receipt - view prototype state" tabindex="0"><title>Explore known receipt - view prototype state</title><rect x="116" y="692" width="208.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="136" y="721" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="136" dy="0">Explore known receipt</tspan></text></a><a href="../atlas.html#screen=publication-preview" aria-label="Inspect original preview - view prototype state" tabindex="0"><title>Inspect original preview - view prototype state</title><rect x="336.0" y="692" width="232.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="356.0" y="721" fill="#345EAD" font-size="15" font-weight="600"><tspan x="356.0" dy="0">Inspect original preview</tspan></text></a><a href="../atlas.html#screen=report-detail" aria-label="Back to report - view prototype state" tabindex="0"><title>Back to report - view prototype state</title><rect x="580.0" y="692" width="152.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="600.0" y="721" fill="#345EAD" font-size="15" font-weight="600"><tspan x="600.0" dy="0">Back to report</tspan></text></a><text x="116" y="772" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>