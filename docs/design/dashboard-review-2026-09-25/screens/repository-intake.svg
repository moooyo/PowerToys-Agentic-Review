roke="#F3F4FA"/><text x="132" y="249" fill="#505966" font-size="14" font-weight="400"><tspan x="132" dy="0">Overview</tspan></text><text x="230" y="249" fill="#345EAD" font-size="14" font-weight="600"><tspan x="230" dy="0">Intake</tspan></text><rect x="226" y="261" width="66" height="3" rx="1" fill="#345EAD" stroke="#345EAD"/><text x="320" y="249" fill="#505966" font-size="14" font-weight="400"><tspan x="320" dy="0">Replies</tspan></text><rect x="116" y="284" width="1052" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="284" width="5" height="224" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="314" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Event intake</tspan></text><rect x="136" y="331" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="354" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Listen for assignments: on</tspan></text><rect x="136" y="385" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="408" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Allow trusted E2E commands: off</tspan></text><rect x="136" y="439" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="462" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Assignment recipient ID: sample GitHub user ID</tspan></text><rect x="116" y="524" width="1052" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="524" width="5" height="224" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="554" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Trusted actors and endpoint</tspan></text><rect x="136" y="571" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="594" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Trusted GitHub user IDs: sample allowlist</tspan></text><rect x="136" y="625" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="648" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Webhook endpoint: read-only value with copy control</tspan></text><rect x="136" y="679" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="702" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Field errors identify the precise invalid value.</tspan></text><rect x="116" y="764" width="1052" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="764" width="5" height="224" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="136" y="794" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Save behavior</tspan></text><rect x="136" y="811" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="834" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Save settings requires repository management access and a net change.</tspan></text><rect x="136" y="865" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="888" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Busy or conflicting settings disable editing and submission.</tspan></text><rect x="136" y="919" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="942" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Discard, Download draft, and Reload have different effects.</tspan></text><a href="../atlas.html#screen=repository-conflict" aria-label="Save settings: conflict example - view prototype state" tabindex="0"><title>Save settings: conflict example - view prototype state</title><rect x="116" y="1012" width="288.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="136" y="1041" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="136" dy="0">Save settings: conflict example</tspan></text></a><a href="../atlas.html#screen=unsaved-changes" aria-label="Leave this draft - view prototype state" tabindex="0"><title>Leave this draft - view prototype state</title><rect x="416.0" y="1012" width="168.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="436.0" y="1041" fill="#345EAD" font-size="15" font-weight="600"><tspan x="436.0" dy="0">Leave this draft</tspan></text></a><a href="../atlas.html#screen=repository-replies" aria-label="Review replies - view prototype state" tabindex="0"><title>Review replies - view prototype state</title><rect x="596.0" y="1012" width="152.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="616.0" y="1041" fill="#345EAD" font-size="15" font-weight="600"><tspan x="616.0" dy="0">Review replies</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Back to repositories - view prototype state" tabindex="0"><title>Back to repositories - view prototype state</title><rect x="760.0" y="1012" width="200.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="780.0" y="1041" fill="#345EAD" font-size="15" font-weight="600"><tspan x="780.0" dy="0">Back to repositories</tspan></text></a><text x="116" y="1092" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>