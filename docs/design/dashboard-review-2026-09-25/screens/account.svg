-weight="400"><tspan x="18" dy="0">Activity</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Workspace" tabindex="0"><title>Workspace</title><rect x="12" y="357" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="382" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">W</tspan></text><text x="15" y="405" fill="#505966" font-size="11" font-weight="400"><tspan x="15" dy="0">Workspace</tspan></text></a><rect x="84" y="0" width="1116" height="76" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="116" y="32" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="116" dy="0">Agentic Review</tspan></text><text x="116" y="55" fill="#505966" font-size="13" font-weight="400"><tspan x="116" dy="0">Review workspace</tspan></text><rect x="455" y="17" width="354" height="42" rx="22" fill="#F3F4FA" stroke="#D4DAE5"/><text x="473" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="473" dy="0">Repository / Illustrative scope</tspan></text><text x="886" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="886" dy="0">Search</tspan></text><a href="../atlas.html#screen=account" aria-label="My account" tabindex="0"><title>My account</title><rect x="1098" y="17" width="46" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="1110" y="43" fill="#173D79" font-size="15" font-weight="600"><tspan x="1110" dy="0">RV</tspan></text></a><text x="116" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="116" dy="0">ACCESS / account</tspan></text><text x="116" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="116" dy="0">My account</tspan></text><rect x="116" y="172" width="143.5" height="30" rx="15" fill="#DCE6FF" stroke="#DCE6FF"/><text x="130" y="192" fill="#173D79" font-size="13" font-weight="600"><tspan x="130" dy="0">Current session</tspan></text><rect x="116" y="222" width="1052" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="222" width="5" height="224" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Current account</tspan></text><rect x="136" y="269" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="292" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Display name: Demo reviewer; username: demo.reviewer</tspan></text><rect x="136" y="323" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="346" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Repository scope and effective permissions are shown read-only.</tspan></text><rect x="136" y="377" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="400" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Administrator status is shown only when granted.</tspan></text><rect x="116" y="462" width="1052" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="462" width="5" height="224" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="492" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Change password</tspan></text><rect x="136" y="509" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="532" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Current password: hidden</tspan></text><rect x="136" y="563" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="586" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">New password: hidden; confirm new password: hidden</tspan></text><rect x="136" y="617" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="640" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Each password field supports show or hide and field-specific feedback.</tspan></text><rect x="116" y="702" width="1052" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="702" width="5" height="224" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="136" y="732" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Session behavior</tspan></text><rect x="136" y="749" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="772" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Changing a password ends existing sessions and requires sign-in again.</tspan></text><rect x="136" y="803" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="826" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">Unsaved password fields invoke the navigation guard.</tspan></text><rect x="136" y="857" width="1012" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="148" y="880" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="148" dy="0">This prototype uses no real credentials and changes no password.</tspan></text><a href="../atlas.html#screen=sign-in" aria-label="Review sign-in after change - view prototype state" tabindex="0"><title>Review sign-in after change - view prototype state</title><rect x="116" y="950" width="256.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="136" y="979" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="136" dy="0">Review sign-in after change</tspan></text></a><a href="../atlas.html#screen=unsaved-changes" aria-label="Review unsaved password draft - view prototype state" tabindex="0"><title>Review unsaved password draft - view prototype state</title><rect x="384.0" y="950" width="272.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="404.0" y="979" fill="#345EAD" font-size="15" font-weight="600"><tspan x="404.0" dy="0">Review unsaved password draft</tspan></text></a><a href="../atlas.html#screen=pull-requests" aria-label="Return to review workspace - view prototype state" tabindex="0"><title>Return to review workspace - view prototype state</title><rect x="668.0" y="950" width="248.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="688.0" y="979" fill="#345EAD" font-size="15" font-weight="600"><tspan x="688.0" dy="0">Return to review workspace</tspan></text></a><a href="../atlas.html#screen=session-expired" aria-label="Review session expiry - view prototype state" tabindex="0"><title>Review session expiry - view prototype state</title><rect x="928.0" y="950" width="208.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="948.0" y="979" fill="#345EAD" font-size="15" font-weight="600"><tspan x="948.0" dy="0">Review session expiry</tspan></text></a><text x="116" y="1030" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>