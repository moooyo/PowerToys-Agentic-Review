ll="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="222" width="5" height="138" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="136" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Retain readable context</tspan></text><text x="136" y="282" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Show the last successful snapshot with a visible warning.</tspan></text><text x="136" y="320" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Retry refresh without implying the data is current.</tspan></text><rect x="116" y="376" width="1052" height="138" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="376" width="5" height="138" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="406" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Constrain stale actions</tspan></text><text x="136" y="436" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Task cancellation and recovery require a successful refresh.</tspan></text><text x="136" y="474" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">If access is denied, protected cached content is hidden.</tspan></text><a href="../atlas.html#screen=tasks" aria-label="Explore refreshed tasks - view prototype state" tabindex="0"><title>Explore refreshed tasks - view prototype state</title><rect x="116" y="538" width="224.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="136" y="567" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="136" dy="0">Explore refreshed tasks</tspan></text></a><a href="../atlas.html#screen=reports" aria-label="Inspect retained reports - view prototype state" tabindex="0"><title>Inspect retained reports - view prototype state</title><rect x="352.0" y="538" width="232.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="372.0" y="567" fill="#345EAD" font-size="15" font-weight="600"><tspan x="372.0" dy="0">Inspect retained reports</tspan></text></a