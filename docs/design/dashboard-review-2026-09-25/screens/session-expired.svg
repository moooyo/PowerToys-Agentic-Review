<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="group" aria-label="Session expired" style="font-family:Segoe UI,Arial,sans-serif"><title>Session expired</title><desc>An expired or unverifiable session replaces the workspace with sign-in and clears identity-bound cached data.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1200" height="920" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><text x="40" y="42" fill="#345EAD" font-size="20" font-weight="600"><tspan x="40" dy="0">Agentic Review</tspan></text><rect x="256" y="85" width="688" height="818" rx="24" fill="#FFFFFF" stroke="#D4DAE5"/><text x="280" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="280" dy="0">ACCESS / session-expired</tspan></text><text x="280" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="280" dy="0">Session expired</tspan></text><rect x="280" y="172" width="151.2" height="30" rx="15" fill="#FFF0D4" stroke="#FFF0D4"/><text x="294" y="192" fill="#775000" font-size="13" font-weight="600"><tspan x="294" dy="0">Sign-in required</tspan></text><rect x="280" y="222" width="640" height="138" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="280" y="222" width="5" height="138" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="300" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="300" dy="0">Session notice</tspan></text><text x="300" y="282" fill="#505966" font-size="15" font-weight="400"><tspan x="300" dy="0">Your session expired. Sign in again.</tspan></text><text x="300" y="320" fill="#505966" font-size="15" font-weight="400"><tspan x="300" dy="0">An unavailable session check offers connection retry or a new sign-in.</tspan></text><rect x="280" y="376" width="640" height="220" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="280" y="376" width="5" height="220" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="300" y="406" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="300" dy="0">Identity boundary</tspan></text><text x="300" y="436" fill="#505966" font-size="15" font-weight="400"><tspan x="300" dy="0">Investigation requests are suspended while access is unverified.</tspan></text><text x="300" y="474" fill="#505966" font-size="15" font-weight="400"><tspan x="300" dy="0">Queries and cached private data are cleared when identity or grants</tspan><tspan x="300" dy="22">change.</tspan></text><text x="300" y="534" fill="#505966" font-size="15" font-weight="400"><tspan x="300" dy="0">Access is resumed only after a valid authenticated session is</tspan><tspan x="300" dy="22">established.</tspan></text><rect x="280" y="612" width="640" height="176" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="280" y="612" width="5" height="176" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="300" y="642" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="300" dy="0">Return path</tspan></text><text x="300" y="672" fill="#505966" font-size="15" font-weight="400"><tspan x="300" dy="0">The sign-in form is displayed over the current route.</tspan></text><text x="300" y="710" fill="#505966" font-size="15" font-weight="400"><tspan x="300" dy="0">A valid new identity must still be authorized for the requested view.</tspan></text><text x="300" y="748" fill="#505966" font-size="15" font-weight="400"><tspan x="300" dy="0">The prototype does not restore or impersonate a real session.</tspan></text><a href="../atlas.html#screen=sign-in" aria-label="Sign in again - view prototype state" tabindex="0"><title>Sign in again - view prototype state</title><rect x="280" y="812" width="144.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="300" y="841" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="300" dy="0">Sign in again</tspan></text></a><a href="../atlas.html#screen=session-expired" aria-label="Retry connection - view prototype state" tabindex="0"><title>Retry connection - view prototype state</title><rect x="436.0" y="812" width="168.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="456.0" y="841" fill="#345EAD" font-size="15" font-weight="600"><tspan x="456.0" dy="0">Retry connection</tspan></text></a><text x="280" y="892" fill="#505966" font-size="11" font-weight="400"><tspan x="280" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>