 height="66" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="132" y="420" fill="#173D79" font-size="15" font-weight="600"><tspan x="132" dy="0">example/PowerToys-fork</tspan></text><text x="542.28" y="420" fill="#505966" font-size="15" font-weight="400"><tspan x="542.28" dy="0">Off</tspan></text><text x="756.1866666666666" y="420" fill="#505966" font-size="15" font-weight="400"><tspan x="756.1866666666666" dy="0">Unavailable</tspan></text><text x="970.0933333333332" y="420" fill="#505966" font-size="15" font-weight="400"><tspan x="970.0933333333332" dy="0">Read</tspan></text></a><rect x="116" y="484" width="644" height="198" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="484" width="5" height="198" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="514" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Repository overview</tspan></text><text x="136" y="544" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Review work: pull requests, issues, tasks, comments, and webhook</tspan><tspan x="136" dy="22">events</tspan></text><text x="136" y="604" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Automation: event intake and automatic reply summaries</tspan></text><text x="136" y="642" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Import work item and Open on GitHub are separate entry points.</tspan></text><rect x="780" y="484" width="388" height="242" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="780" y="484" width="5" height="242" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="800" y="514" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="800" dy="0">Directory search</tspan></text><text x="800" y="544" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Find a repository by name or ID.</tspan></text><text x="800" y="582" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">No scope, no matching repositories, and</tspan><tspan x="800" dy="22">unavailable repository links have</tspan><tspan x="800" dy="22">distinct states.</tspan></text><text x="800" y="664" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Intake and reply summaries can fail</tspan><tspan x="800" dy="22">independently.</tspan></text><rect x="780" y="742" width="388" height="160" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="780" y="742" width="5" height="160" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="800" y="772" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="800" dy="0">Workspace scheduling</tspan></text><text x="800" y="802" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Scheduling applies to all repositories.</tspan></text><text x="800" y="840" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">It opens a separate workspace-level view</tspan><tspan x="800" dy="22">rather than a repository-specific limit.</tspan></text><a href="../atlas.html#screen=repository-intake" aria-label="Configure intake - view prototype state" tabindex="0"><title>Configure intake - view prototype state</title><rect x="116" y="926" width="168.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="136" y="955" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="136" dy="0">Configure intake</tspan></text></a><a href="../atlas.html#screen=repository-replies" aria-label="Configure replies - view prototype state" tabindex="0"><title>Configure replies - view prototype state</title><rect x="296.0" y="926" width="176.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="316.0" y="955" fill="#345EAD" font-size="15" font-weight="600"><tspan x="316.0" dy="0">Configure replies</tspan></text></a><a href="../atlas.html#screen=scheduling" aria-label="Workspace scheduling - view prototype state" tabindex="0"><title>Workspace scheduling - view prototype state</title><rect x="484.0" y="926" width="200.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="504.0" y="955" fill="#345EAD" font-size="15" font-weight="600"><tspan x="504.0" dy="0">Workspace scheduling</tspan></text></a><a href="../atlas.html#screen=pull-requests" aria-label="Review pull requests - view prototype state" tabindex="0"><title>Review pull requests - view prototype state</title><rect x="696.0" y="926" width="200.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="716.0" y="955" fill="#345EAD" font-size="15" font-weight="600"><tspan x="716.0" dy="0">Review pull requests</tspan></text></a><text x="116" y="1006" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>