<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="854" viewBox="0 0 1200 854" role="group" aria-label="Comment publication" style="font-family:Segoe UI,Arial,sans-serif"><title>Comment publication</title><desc>Inspect the retained body, related work, and delivery history. The illustrated acknowledgement remains unconfirmed.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1200" height="854" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><rect x="0" y="0" width="84" height="854" rx="0" fill="#F3F4FA" stroke="#F3F4FA"/><rect x="18" y="20" width="48" height="48" rx="16" fill="#345EAD" stroke="#345EAD"/><text x="29" y="50" fill="#FFFFFF" font-size="19" font-weight="600"><tspan x="29" dy="0">AR</tspan></text><a href="../atlas.html#screen=pull-requests" aria-label="Review" tabindex="0"><title>Review</title><rect x="12" y="102" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="127" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">R</tspan></text><text x="24" y="150" fill="#505966" font-size="11" font-weight="400"><tspan x="24" dy="0">Review</tspan></text></a><a href="../atlas.html#screen=tasks" aria-label="Tasks" tabindex="0"><title>Tasks</title><rect x="12" y="187" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="212" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">T</tspan></text><text x="27" y="235" fill="#505966" font-size="11" font-weight="400"><tspan x="27" dy="0">Tasks</tspan></text></a><a href="../atlas.html#screen=comments" aria-label="Activity" tabindex="0"><title>Activity</title><rect x="12" y="272" width="60" height="62" rx="18" fill="#DFE6F4" stroke="#F3F4FA"/><text x="35" y="297" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">A</tspan></text><text x="18" y="320" fill="#505966" font-size="11" font-weight="400"><tspan x="18" dy="0">Activity</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Workspace" tabindex="0"><title>Workspace</title><rect x="12" y="357" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="382" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">W</tspan></text><text x="15" y="405" fill="#505966" font-size="11" font-weight="400"><tspan x="15" dy="0">Workspace</tspan></text></a><rect x="84" y="0" width="1116" height="76" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="116" y="32" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="116" dy="0">Agentic Review</tspan></text><text x="116" y="55" fill="#505966" font-size="13" font-weight="400"><tspan x="116" dy="0">Review workspace</tspan></text><rect x="455" y="17" width="354" height="42" rx="22" fill="#F3F4FA" stroke="#D4DAE5"/><text x="473" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="473" dy="0">Repository / Illustrative scope</tspan></text><text x="886" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="886" dy="0">Search</tspan></text><a href="../atlas.html#screen=account" aria-label="My account" tabindex="0"><title>My account</title><rect x="1098" y="17" width="46" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="1110" y="43" fill="#173D79" font-size="15" font-weight="600"><tspan x="1110" dy="0">RV</tspan></text></a><text x="116" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="116" dy="0">ACTIVITY / comment-detail</tspan></text><text x="116" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="116" dy="0">Comment publication</tspan></text><rect x="116" y="172" width="112.7" height="30" rx="15" fill="#FFF0D4" stroke="#FFF0D4"/><text x="130" y="192" fill="#775000" font-size="13" font-weight="600"><tspan x="130" dy="0">Unconfirmed</tspan></text><rect x="116" y="222" width="644" height="176" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="222" width="5" height="176" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Retained publication</tspan></text><text x="136" y="282" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Type: review result for a sample pull request</tspan></text><text x="136" y="320" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Body: saved review summary and findings</tspan></text><text x="136" y="358" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Source, task, report, and GitHub links use the retained context.</tspan></text><rect x="780" y="222" width="388" height="242" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="780" y="222" width="5" height="242" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="800" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="800" dy="0">Delivery history</tspan></text><text x="800" y="282" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Each attempt retains its original body</tspan><tspan x="800" dy="22">and outcome.</tspan></text><text x="800" y="342" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Sending, succeeded, failed, cancelled,</tspan><tspan x="800" dy="22">and unknown remain distinct.</tspan></text><text x="800" y="402" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">An earlier delivered body can coexist</tspan><tspan x="800" dy="22">with a newer uncertain request.</tspan></text><rect x="780" y="480" width="388" height="242" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="780" y="480" width="5" height="242" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="800" y="510" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="800" dy="0">Acknowledgement unknown</tspan></text><text x="800" y="540" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">Refresh publication reads the current</tspan><tspan x="800" dy="22">object; it does not clear Unknown.</tspan></text><text x="800" y="600" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">A new synchronization requires the exact</tspan><tspan x="800" dy="22">preview and a separate confirmation.</tspan></text><text x="800" y="660" fill="#505966" font-size="15" font-weight="400"><tspan x="800" dy="0">This wireframe does not send, retry, or</tspan><tspan x="800" dy="22">reconcile a real comment.</tspan></text><a href="../atlas.html#screen=comments" aria-label="Back to comments - view prototype state" tabindex="0"><title>Back to comments - view prototype state</title><rect x="116" y="746" width="168.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="136" y="775" fill="#345EAD" font-size="15" font-weight="600"><tspan x="136" dy="0">Back to comments</tspan></text></a><a href="../atlas.html#screen=comment-detail" aria-label="Refresh publication - view prototype state" tabindex="0"><title>Refresh publication - view prototype state</title><rect x="296.0" y="746" width="192.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="316.0" y="775" fill="#345EAD" font-size="15" font-weight="600"><tspan x="316.0" dy="0">Refresh publication</tspan></text></a><a href="../atlas.html#screen=task-detail" aria-label="Open task - view prototype state" tabindex="0"><title>Open task - view prototype state</title><rect x="500.0" y="746" width="130" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="520.0" y="775" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="520.0" dy="0">Open task</tspan></text></a><a href="../atlas.html#screen=report-detail" aria-label="Open report - view prototype state" tabindex="0"><title>Open report - view prototype state</title><rect x="642.0" y="746" width="130" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="662.0" y="775" fill="#345EAD" font-size="15" font-weight="600"><tspan x="662.0" dy="0">Open report</tspan></text></a><text x="116" y="826" fill="#505966" font-size="11" font-weight="400"><tspan x="116" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>