<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1118" viewBox="0 0 1200 1118" role="group" aria-label="Account editor dialog" style="font-family:Segoe UI,Arial,sans-serif"><title>Account editor dialog</title><desc>A modal editor separates identity, repository access, capabilities, and credential reset. This wireframe changes no account.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1200" height="1118" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><rect x="0" y="0" width="84" height="1118" rx="0" fill="#F3F4FA" stroke="#F3F4FA"/><rect x="18" y="20" width="48" height="48" rx="16" fill="#345EAD" stroke="#345EAD"/><text x="29" y="50" fill="#FFFFFF" font-size="19" font-weight="600"><tspan x="29" dy="0">AR</tspan></text><a href="../atlas.html#screen=pull-requests" aria-label="Review" tabindex="0"><title>Review</title><rect x="12" y="102" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="127" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">R</tspan></text><text x="24" y="150" fill="#505966" font-size="11" font-weight="400"><tspan x="24" dy="0">Review</tspan></text></a><a href="../atlas.html#screen=tasks" aria-label="Tasks" tabindex="0"><title>Tasks</title><rect x="12" y="187" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="212" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">T</tspan></text><text x="27" y="235" fill="#505966" font-size="11" font-weight="400"><tspan x="27" dy="0">Tasks</tspan></text></a><a href="../atlas.html#screen=comments" aria-label="Activity" tabindex="0"><title>Activity</title><rect x="12" y="272" width="60" height="62" rx="18" fill="#F3F4FA" stroke="#F3F4FA"/><text x="35" y="297" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">A</tspan></text><text x="18" y="320" fill="#505966" font-size="11" font-weight="400"><tspan x="18" dy="0">Activity</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Workspace" tabindex="0"><title>Workspace</title><rect x="12" y="357" width="60" height="62" rx="18" fill="#DFE6F4" stroke="#F3F4FA"/><text x="35" y="382" fill="#173D79" font-size="19" font-weight="600"><tspan x="35" dy="0">W</tspan></text><text x="15" y="405" fill="#505966" font-size="11" font-weight="400"><tspan x="15" dy="0">Workspace</tspan></text></a><rect x="84" y="0" width="1116" height="76" rx="0" fill="#FFFFFF" stroke="#D4DAE5"/><text x="116" y="32" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="116" dy="0">Agentic Review</tspan></text><text x="116" y="55" fill="#505966" font-size="13" font-weight="400"><tspan x="116" dy="0">Review workspace</tspan></text><rect x="455" y="17" width="354" height="42" rx="22" fill="#F3F4FA" stroke="#D4DAE5"/><text x="473" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="473" dy="0">Repository / Illustrative scope</tspan></text><text x="886" y="43" fill="#505966" font-size="14" font-weight="400"><tspan x="886" dy="0">Search</tspan></text><a href="../atlas.html#screen=account" aria-label="My account" tabindex="0"><title>My account</title><rect x="1098" y="17" width="46" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="1110" y="43" fill="#173D79" font-size="15" font-weight="600"><tspan x="1110" dy="0">RV</tspan></text></a><rect x="84" y="76" width="1116" height="1042" rx="0" fill="#E7EBF4" stroke="#E7EBF4"/><rect x="212" y="85" width="894" height="1016" rx="24" fill="#FFFFFF" stroke="#D4DAE5"/><text x="236" y="114" fill="#505966" font-size="12" font-weight="600"><tspan x="236" dy="0">WORKSPACE / account-editor</tspan></text><text x="236" y="155" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="236" dy="0">Account editor dialog</tspan></text><rect x="236" y="172" width="166.6" height="30" rx="15" fill="#DCE6FF" stroke="#DCE6FF"/><text x="250" y="192" fill="#173D79" font-size="13" font-weight="600"><tspan x="250" dy="0">Local access draft</tspan></text><rect x="236" y="222" width="846" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="236" y="222" width="5" height="224" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="256" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="256" dy="0">Identity</tspan></text><rect x="256" y="269" width="806" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="268" y="292" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="268" dy="0">Username: demo.reviewer; display name: Demo reviewer</tspan></text><rect x="256" y="323" width="806" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="268" y="346" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="268" dy="0">Initial password is present only when creating an account.</tspan></text><rect x="256" y="377" width="806" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="268" y="400" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="268" dy="0">Administrator and Account enabled are separate switches.</tspan></text><rect x="236" y="462" width="846" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="236" y="462" width="5" height="224" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="256" y="492" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="256" dy="0">Repository access</tspan></text><rect x="256" y="509" width="806" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="268" y="532" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="268" dy="0">Repository IDs define the allowed scope.</tspan></text><rect x="256" y="563" width="806" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="268" y="586" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="268" dy="0">Permissions include management, task creation, cancellation, preparation, and execution.</tspan></text><rect x="256" y="617" width="806" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="268" y="640" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="268" dy="0">Action capabilities and repository code execution are separate grants.</tspan></text><rect x="236" y="702" width="846" height="224" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="236" y="702" width="5" height="224" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="256" y="732" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="256" dy="0">Conflict and reset</tspan></text><rect x="256" y="749" width="806" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="268" y="772" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="268" dy="0">A conflicting version requires reading and reviewing the latest account.</tspan></text><rect x="256" y="803" width="806" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="268" y="826" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="268" dy="0">Reset password uses its own dialog and confirms sign-out everywhere.</tspan></text><rect x="256" y="857" width="806" height="44" rx="6" fill="#FAF9FD" stroke="#D4DAE5"/><text x="268" y="880" fill="#1B1D24" font-size="15" font-weight="400"><tspan x="268" dy="0">Closing a dirty editor invokes the unsaved-change guard.</tspan></text><a href="../atlas.html#screen=accounts" aria-label="Review account directory - view prototype state" tabindex="0"><title>Review account directory - view prototype state</title><rect x="236" y="950" width="232.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="256" y="979" fill="#345EAD" font-size="15" font-weight="600"><tspan x="256" dy="0">Review account directory</tspan></text></a><a href="../atlas.html#screen=unsaved-changes" aria-label="Review unsaved changes - view prototype state" tabindex="0"><title>Review unsaved changes - view prototype state</title><rect x="480.0" y="950" width="216.0" height="46" rx="23" fill="#345EAD" stroke="#345EAD"/><text x="500.0" y="979" fill="#FFFFFF" font-size="15" font-weight="600"><tspan x="500.0" dy="0">Review unsaved changes</tspan></text></a><a href="../atlas.html#screen=sign-in" aria-label="Review sign-in after reset - view prototype state" tabindex="0"><title>Review sign-in after reset - view prototype state</title><rect x="708.0" y="950" width="248.0" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="728.0" y="979" fill="#345EAD" font-size="15" font-weight="600"><tspan x="728.0" dy="0">Review sign-in after reset</tspan></text></a><a href="../atlas.html#screen=account" aria-label="My account - view prototype state" tabindex="0"><title>My account - view prototype state</title><rect x="236" y="1010" width="130" height="46" rx="23" fill="#FFFFFF" stroke="#737D8C"/><text x="256" y="1039" fill="#345EAD" font-size="15" font-weight="600"><tspan x="256" dy="0">My account</tspan></text></a><text x="236" y="1090" fill="#505966" font-size="11" font-weight="400"><tspan x="236" dy="0">SOURCE-DERIVED WIREFRAME / ILLUSTRATIVE CONTENT / LINKED CONTROLS OPEN ANOTHER REVIEW STATE</tspan></text></svg>