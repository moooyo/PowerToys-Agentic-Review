#D4DAE5"/><rect x="116" y="222" width="5" height="138" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="252" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Recorded outcome</tspan></text><text x="136" y="282" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">The server result states success, failure, or cancellation.</tspan></text><text x="136" y="320" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Keep the exact submitted content separate from the new draft.</tspan></text><rect x="116" y="376" width="1052" height="138" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="376" width="5" height="138" rx="2" fill="#EDF0F7" stroke="#EDF0F7"/><text x="136" y="406" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Relevant destination</tspan></text><text x="136" y="436" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Open linked task only when the receipt includes its task ID.</tspan></text><text x="136" y="474" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">A follow-up preserves the parent task and saved report.</tspan></text><rect x="116" y="530" width="1052" height="138" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="116" y="530" width="5" height="138" rx="2" fill="#FFF0D4" stroke="#FFF0D4"/><text x="136" y="560" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="136" dy="0">Publish again intentionally</tspan></text><text x="136" y="590" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">View the previous receipt while editing a fresh draft.</tspan></text><text x="136" y="628" fill="#505966" font-size="15" font-weight="400"><tspan x="136" dy="0">Identical successful content triggers a repeat warning.</tspan></text><a href="../atlas.html#screen=publication-compose" aria-label="Back to draft - view prototype state" tabindex="0"><title>Back to draft - view prototype state</title><rect x="116" y="692" 