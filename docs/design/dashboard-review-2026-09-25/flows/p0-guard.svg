<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="852" viewBox="0 0 1080 852" role="group" aria-label="Inspect an approval blocker" style="font-family:Segoe UI,Arial,sans-serif"><title>Inspect an approval blocker</title><desc>Review a confirmed unresolved P0 from the complete original report; selection and filtering cannot bypass the guard.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1080" height="852" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><text x="34" y="34" fill="#505966" font-size="12" font-weight="600"><tspan x="34" dy="0">REVIEW JOURNEY / P0-GUARD</tspan></text><text x="34" y="72" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="34" dy="0">Inspect an approval blocker</tspan></text><text x="34" y="104" fill="#505966" font-size="15" font-weight="400"><tspan x="34" dy="0">Review a confirmed unresolved P0 from the complete original report; selection and filtering cannot bypass the guard.</tspan></text><a href="../atlas.html#screen=reports" aria-label="Reports" tabindex="0"><title>Reports</title><rect x="34" y="150" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="170" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="197" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">01</tspan></text><text x="112" y="180" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Open saved report</tspan></text><text x="112" y="207" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">The directory queue covers its current page.</tspan></text></a><path d="M 70 250 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=report-detail" aria-label="Report reader" tabindex="0"><title>Report reader</title><rect x="34" y="276" widt