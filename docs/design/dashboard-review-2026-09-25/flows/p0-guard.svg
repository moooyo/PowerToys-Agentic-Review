tspan x="112" dy="0">Use an available action to address the finding.</tspan></text></a><a href="../atlas.html#screen=followup" aria-label="Branch: Inspect an available saved verification plan" tabindex="0"><title>Branch: Inspect an available saved verification plan</title><rect x="34" y="654" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="677" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">P0 approval guard -&gt; Prepare saved follow-up</tspan></text><text x="52" y="701" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Inspect an available saved verification plan</tspan></text></a><a href="../atlas.html#screen=report-detail" aria-label="Branch: Read the exact evidence" tabindex="0"><title>Branch: Read the exact evidence</title><rect x="34" y="744" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="767" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">P0 approval guard -&gt; Report reader</tspan></text><text x="52" y="791" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Read the exact evidence</tspan></text></a></svg>