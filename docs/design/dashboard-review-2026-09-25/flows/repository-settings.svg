<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1374" viewBox="0 0 1080 1374" role="group" aria-label="Review repository settings, local drafts, and version conflicts" style="font-family:Segoe UI,Arial,sans-serif"><title>Review repository settings, local drafts, and version conflicts</title><desc>Trace repository configuration separately from all-repository scheduling and inspect the consequences of leaving or reloading a local draft.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1080" height="1374" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><text x="34" y="34" fill="#505966" font-size="12" font-weight="600"><tspan x="34" dy="0">REVIEW JOURNEY / REPOSITORY-SETTINGS</tspan></text><text x="34" y="72" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="34" dy="0">Review repository settings, local drafts, and version conflicts</tspan></text><text x="34" y="104" fill="#505966" font-size="15" font-weight="400"><tspan x="34" dy="0">Trace repository configuration separately from all-repository scheduling and inspect the consequences of leaving or</tspan><tspan x="34" dy="21">reloading a local draft.</tspan></text><a href="../atlas.html#screen=repositories" aria-label="Repositories" tabindex="0"><title>Repositories</title><rect x="34" y="150" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="170" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="197" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">01</tspan></text><text x="112" y="180" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Choose repository scope</tspan></text><text x="112" y="207" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Locate a configured repository and inspect independent intake and reply summaries.</tspan></text></a><path d="M 70 250 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=repository-intake" aria-label="Repository intake" tabindex="0"><title>Repository intake</title><rect x="34" y="276" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="296" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="323" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">02</tspan></text><text x="112" y="306" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Edit intake</tspan></text><text x="112" y="333" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Review assignment intake, trusted E2E commands, actor IDs, and permission-gated saving.</tspan></text></a><path d="M 70 376 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=unsaved-changes" aria-label="Discard unsaved changes?" tabindex="0"><title>Discard unsaved changes?</title><rect x="34" y="402" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="422" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="449" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">03</tspan></text><text x="112" y="432" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Attempt to leave</tspan></text><text x="112" y="459" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Keep editing or discard local changes; busy requests have a separate guarded state.</tspan></text></a><path d="M 70 502 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=repository-intake" aria-label="Repository intake" tabindex="0"><title>Repository intake</title><rect x="34" y="528" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="548" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="575" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">04</tspan></text><text x="112" y="558" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Keep editing</tspan></text><text x="112" y="585" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">The illustrated intake draft remains the review context.</tspan></text></a><path d="M 70 628 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=repository-conflict" aria-label="Repository settings changed" tabindex="0"><title>Repository settings changed</title><rect x="34" y="654" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="674" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="701" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">05</tspan></text><text x="112" y="684" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Inspect a conflicting save</tspan></text><text x="112" y="711" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">The draft is kept, save is blocked, and Reload replaces local values after the guard.</tspan></text></a><path d="M 70 754 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=repository-replies" aria-label="Repository replies" tabindex="0"><title>Repository replies</title><rect x="34" y="780" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="800" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="827" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">06</tspan></text><text x="112" y="810" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Review automatic replies</tspan></text><text x="112" y="837" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Inspect template validation, preview, authorization, and links to existing publications.</tspan></text></a><a href="../atlas.html#screen=repositories" aria-label="Branch: Discard the illustrated local draft and continue to the directory." tabindex="0"><title>Branch: Discard the illustrated local draft and continue to the directory.</title><rect x="34" y="906" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="929" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Discard unsaved changes? -&gt; Repositories</tspan></text><text x="52" y="953" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Discard the illustrated local draft and continue to the directory.</tspan></text></a><a href="../atlas.html#screen=unsaved-changes" aria-label="Branch: Reload of dirty settings requires draft-replacement confirmation." tabindex="0"><title>Branch: Reload of dirty settings requires draft-replacement confirmation.</title><rect x="34" y="996" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1019" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Repository settings changed -&gt; Discard unsaved changes?</tspan></text><text x="52" y="1043" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Reload of dirty settings requires draft-replacement confirmation.</tspan></text></a><a href="../atlas.html#screen=scheduling" aria-label="Branch: Open global capacity configuration for all repositories." tabindex="0"><title>Branch: Open global capacity configuration for all repositories.</title><rect x="34" y="1086" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1109" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Repositories -&gt; Workspace scheduling</tspan></text><text x="52" y="1133" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Open global 