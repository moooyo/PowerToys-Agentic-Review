<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1374" viewBox="0 0 1080 1374" role="group" aria-label="Trace an event through investigation and publication activity" style="font-family:Segoe UI,Arial,sans-serif"><title>Trace an event through investigation and publication activity</title><desc>Keep webhook handling, task execution, report content, and comment delivery as separate outcomes with explicit context links.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1080" height="1374" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><text x="34" y="34" fill="#505966" font-size="12" font-weight="600"><tspan x="34" dy="0">REVIEW JOURNEY / ACTIVITY-LINKAGE</tspan></text><text x="34" y="72" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="34" dy="0">Trace an event through investigation and publication activity</tspan></text><text x="34" y="104" fill="#505966" font-size="15" font-weight="400"><tspan x="34" dy="0">Keep webhook handling, task execution, report content, and comment delivery as separate outcomes with explicit</tspan><tspan x="34" dy="21">context links.</tspan></text><a href="../atlas.html#screen=webhooks" aria-label="Webhook events" tabindex="0"><title>Webhook events</title><rect x="34" y="150" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="170" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="197" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">01</tspan></text><text x="112" y="180" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Find an incoming event</tspan></text><text x="112" y="207" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Filter by target, handling state, number, or task mode.</tspan></text></a><path d="M 70 250 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=webhook-detail" aria-label="Webhook event details" tabindex="0"><title>Webhook event details</title><rect x="34" y="276" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="296" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="323" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">02</tspan></text><text x="112" y="306" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Inspect handling</tspan></text><text x="112" y="333" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Read the exact phase, retained timeline, and related work; a failed import may have no task.</tspan></text></a><path d="M 70 376 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=task-detail" aria-label="Task workspace" tabindex="0"><title>Task workspace</title><rect x="34" y="402" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="422" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="449" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">03</tspan></text><text x="112" y="432" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Follow matching task context</tspan></text><text x="112" y="459" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">This branch applies only when a task exists and matches the event identity.</tspan></text></a><path d="M 70 502 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=report-detail" aria-label="Report reader" tabindex="0"><title>Report reader</title><rect x="34" y="528" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="548" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="575" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">04</tspan></text><text x="112" y="558" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Read saved conclusions</tspan></text><text x="112" y="585" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Task completion and report findings do not establish publication success.</tspan></text></a><path d="M 70 628 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=comments" aria-label="Comments" tabindex="0"><title>Comments</title><rect x="34" y="654" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="674" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="701" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">05</tspan></text><text x="112" y="684" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Find outgoing publication</tspan></text><text x="112" y="711" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Use exact Task ID filtering to locate the producer&#x27;s retained publication.</tspan></text></a><path d="M 70 754 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=comment-detail" aria-label="Comment publication" tabindex="0"><title>Comment publication</title><rect x="34" y="780" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="800" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="827" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">06</tspan></text><text x="112" y="810" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Inspect delivery and retained body</tspan></text><text x="112" y="837" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Unknown acknowledgement stays unresolved; refreshing is not a resend or confirmation.</tspan></text></a><a href="../atlas.html#screen=repository-intake" aria-label="Branch: Review intake settings when handling was prevented by configuration." tabindex="0"><title>Branch: Review intake settings when handling was prevented by configuration.</title><rect x="34" y="906" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="929" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Webhook event details -&gt; Repository intake</tspan></text><text x="52" y="953" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Review intake settings when handling was prevented by configuration.</tspan></text></a><a href="../atlas.html#screen=webhook-detail" aria-label="Branch: Refresh reads the event without resolving an unknown recovery request." tabindex="0"><title>Branch: Refresh reads the event without resolving an unknown recovery request.</title><rect x="34" y="996" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1019" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Webhook event details -&gt; Webhook event details</tspan></text><text x="52" y="1043" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Refresh reads the event without resolving an unknown recovery request.</tspan></text></a><a href="../atlas.html#screen=comment-detail" aria-label="Branch: Refresh retains the illustrated unconfirmed acknowledgement." tabindex="0"><title>Branch: Refresh retains the illustrated unconfirmed acknowledgement.</title><rect x="34" y="1086" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1109" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Comment publication -&gt; Comment publication</tspan></text><text x="52" y="1133" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Refresh retains the illustrated unconfirmed acknowledgement.</tspan></text></a><a href="../atlas.html#screen=pr-detail" aria-label="Branch: Open the retained source context." tabindex="0"><title>Branch: Open the retained source context.</title><rect x="34" y="1176" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1199" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Comment publication -&gt; Pull request source</tspan></text><text x="52" y="1223" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Open the retained source context.</tspan></text></a><a href="../atlas.html#screen=task-detail" aria-label="Branch: Return to the producer task without changing delivery state." tabindex="0"><title>Branch: Return to the producer task without changing delivery state.</title><rect x="34" y="1266" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1289" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Comment publication -&gt; Task workspace</tspan></text><text x="52" y="1313" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Return to the producer task without changing delivery state.</tspan></text></a></svg>