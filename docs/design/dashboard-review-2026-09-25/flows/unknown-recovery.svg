<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="852" viewBox="0 0 1080 852" role="group" aria-label="Recover an unconfirmed action outcome" style="font-family:Segoe UI,Arial,sans-serif"><title>Recover an unconfirmed action outcome</title><desc>Preserve the existing intent and distinguish status reads from permission-gated reconciliation. No new action is inferred.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1080" height="852" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><text x="34" y="34" fill="#505966" font-size="12" font-weight="600"><tspan x="34" dy="0">REVIEW JOURNEY / UNKNOWN-RECOVERY</tspan></text><text x="34" y="72" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="34" dy="0">Recover an unconfirmed action outcome</tspan></text><text x="34" y="104" fill="#505966" font-size="15" font-weight="400"><tspan x="34" dy="0">Preserve the existing intent and distinguish status reads from permission-gated reconciliation. No new action is</tspan><tspan x="34" dy="21">inferred.</tspan></text><a href="../atlas.html#screen=publication-preview" aria-label="Exact action preview" tabindex="0"><title>Exact action preview</title><rect x="34" y="150" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="170" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="197" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">01</tspan></text><text x="112" y="180" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Inspect the prepared intent</tspan></text><text x="112" y="207" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Exact target and payload are already bound.</tspan></text></a><path d="M 70 250 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=unknown-outcome" aria-label="Unconfirmed action outcome" tabindex="0"><title>Unconfirmed action outcome</title><rect x="34" y="276" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="296" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="323" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">02</tspan></text><text x="112" y="306" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Keep the uncertain submission</tspan></text><text x="112" y="333" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Do not replace uncertainty with a new submission.</tspan></text></a><path d="M 70 376 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=action-receipt" aria-label="Action receipt" tabindex="0"><title>Action receipt</title><rect x="34" y="402" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="422" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="449" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">03</tspan></text><text x="112" y="432" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Review a known result</tspan></text><text x="112" y="459" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Proceed only when the authoritative intent has a known outcome.</tspan></text></a><path d="M 70 502 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=publication-compose" aria-label="Compose publication" tabindex="0"><title>Compose publication</title><rect x="34" y="528" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="548" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="575" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">04</tspan></text><text x="112" y="558" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Return to private draft</tspan></text><text x="112" y="585" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">The prior submitted snapshot stays unchanged.</tspan></text></a><a href="../atlas.html#screen=unknown-outcome" aria-label="Branch: Still unknown after refresh or reconciliation" tabindex="0"><title>Branch: Still unknown after refresh or reconciliation</title><rect x="34" y="654" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="677" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Unconfirmed action outcome -&gt; Unconfirmed action outcome</tspan></text><text x="52" y="701" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Still unknown after refresh or reconciliation</tspan></text></a><a href="../atlas.html#screen=report-detail" aria-label="Branch: Leave while preserving the pending submission" tabindex="0"><title>Branch: Leave while preserving the pending submission</title><rect x="34" y="744" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="767" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Unconfirmed action outcome -&gt; Report reader</tspan></text><text x="52" y="791" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Leave while preserving the pending submission</tspan></text></a></svg>