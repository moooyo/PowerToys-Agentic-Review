<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1158" viewBox="0 0 1080 1158" role="group" aria-label="Enter the workspace and recover an expired session" style="font-family:Segoe UI,Arial,sans-serif"><title>Enter the workspace and recover an expired session</title><desc>Review the authentication gate, signed-in navigation, account controls, and identity boundaries without using real credentials.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1080" height="1158" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><text x="34" y="34" fill="#505966" font-size="12" font-weight="600"><tspan x="34" dy="0">REVIEW JOURNEY / AUTH</tspan></text><text x="34" y="72" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="34" dy="0">Enter the workspace and recover an expired session</tspan></text><text x="34" y="104" fill="#505966" font-size="15" font-weight="400"><tspan x="34" dy="0">Review the authentication gate, signed-in navigation, account controls, and identity boundaries without using real</tspan><tspan x="34" dy="21">credentials.</tspan></text><a href="../atlas.html#screen=sign-in" aria-label="Sign in" tabindex="0"><title>Sign in</title><rect x="34" y="150" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="170" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="197" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">01</tspan></text><text x="112" y="180" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Sign in</tspan></text><text x="112" y="207" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Inspect required fields, password visibility, pending feedback, and connection retry.</tspan></text></a><path d="M 70 250 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=pull-requests" aria-label="Pull requests" tabindex="0"><title>Pull requests</title><rect x="34" y="276" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="296" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="323" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">02</tspan></text><text x="112" y="306" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Enter review work</tspan></text><text x="112" y="333" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">A successful product login reveals only the repository scope and actions granted to that identity.</tspan></text></a><path d="M 70 376 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=account" aria-label="My account" tabindex="0"><title>My account</title><rect x="34" y="402" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="422" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="449" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">03</tspan></text><text x="112" y="432" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Inspect current account</tspan></text><text x="112" y="459" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Review access and the separate password-change flow.</tspan></text></a><path d="M 70 502 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=session-expired" aria-label="Session expired" tabindex="0"><title>Session expired</title><rect x="34" y="528" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="548" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="575" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">04</tspan></text><text x="112" y="558" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Handle expiry</tspan></text><text x="112" y="585" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Suspend requests, clear identity-bound cached data, and show the sign-in gate.</tspan></text></a><path d="M 70 628 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=sign-in" aria-label="Sign in" tabindex="0"><title>Sign in</title><rect x="34" y="654" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="674" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="701" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">05</tspan></text><text x="112" y="684" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Re-enter</tspan></text><text x="112" y="711" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">A new valid session must re-establish its own permissions; this prototype does not authenticate.</tspan></text></a><a href="../atlas.html#screen=sign-in" aria-label="Branch: Invalid fields or unavailable connection retain the sign-in form." tabindex="0"><title>Branch: Invalid fields or unavailable connection retain the sign-in form.</title><rect x="34" y="780" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="803" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Sign in -&gt; Sign in</tspan></text><text x="52" y="827" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Invalid fields or unavailable connection retain the sign-in form.</tspan></text></a><a href="../atlas.html#screen=unsaved-changes" aria-label="Branch: Entered password values are protected when leaving." tabindex="0"><title>Branch: Entered password values are protected when leaving.</title><rect x="34" y="870" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="893" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">My account -&gt; Discard unsaved changes?</tspan></text><text x="52" y="917" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Entered password values are protected when leaving.</tspan></text></a><a href="../atlas.html#screen=sign-in" aria-label="Branch: A successful password change requires signing in again in the product." tabindex="0"><title>Branch: A successful password change requires signing in again in the product.</title><rect x="34" y="960" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="983" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">My account -&gt; Sign in</tspan></text><text x="52" y="1007" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: A successful password change requires signing in again in the product.</tspan></text></a><a href="../atlas.html#screen=session-expired" aria-label="Branch: An unverified connection keeps the authentication gate visible." tabindex="0"><title>Branch: An unverified connection keeps the authentication gate visible.</title><rect x="34" y="1050" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1073" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Session expired -&gt; Session expired</tspan></text><text x="52" y="1097" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: An unverified connection keeps the authentication gate visible.</tspan></text></a></svg>