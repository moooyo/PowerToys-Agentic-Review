<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1104" viewBox="0 0 1080 1104" role="group" aria-label="Move from issue assessment to linked work" style="font-family:Segoe UI,Arial,sans-serif"><title>Move from issue assessment to linked work</title><desc>Review a saved plan and exact source before requesting linked work; a child task is navigable only when returned by the server.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1080" height="1104" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><text x="34" y="34" fill="#505966" font-size="12" font-weight="600"><tspan x="34" dy="0">REVIEW JOURNEY / ISSUE-FOLLOWUP</tspan></text><text x="34" y="72" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="34" dy="0">Move from issue assessment to linked work</tspan></text><text x="34" y="104" fill="#505966" font-size="15" font-weight="400"><tspan x="34" dy="0">Review a saved plan and exact source before requesting linked work; a child task is navigable only when returned by</tspan><tspan x="34" dy="21">the server.</tspan></text><a href="../atlas.html#screen=issues" aria-label="Issues" tabindex="0"><title>Issues</title><rect x="34" y="150" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="170" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="197" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">01</tspan></text><text x="112" y="180" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Choose issue</tspan></text><text x="112" y="207" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Bug verification and feature decisions differ.</tspan></text></a><path d="M 70 250 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=bug-detail" aria-label="Bug investigation" tabindex="0"><title>Bug investigation</title><rect x="34" y="276" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="296" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="323" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">02</tspan></text><text x="112" y="306" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Read assessment</tspan></text><text x="112" y="333" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Not run does not mean Not reproduced.</tspan></text></a><path d="M 70 376 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=followup" aria-label="Prepare saved follow-up" tabindex="0"><title>Prepare saved follow-up</title><rect x="34" y="402" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="422" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="449" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">03</tspan></text><text x="112" y="432" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Review plan and source</tspan></text><text x="112" y="459" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Issue snapshot plans may require a full commit SHA.</tspan></text></a><path d="M 70 502 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=publication-preview" aria-label="Exact action preview" tabindex="0"><title>Exact action preview</title><rect x="34" y="528" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="548" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="575" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">04</tspan></text><text x="112" y="558" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Inspect bound intent</tspan></text><text x="112" y="585" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Preparation and execution access remain separate.</tspan></text></a><path d="M 70 628 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=action-receipt" aria-label="Action receipt" tabindex="0"><title>Action receipt</title><rect x="34" y="654" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="674" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="701" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">05</tspan></text><text x="112" y="684" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Read accepted result</tspan></text><text x="112" y="711" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Only a receipt with taskId offers a child-task link.</tspan></text></a><path d="M 70 754 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=task-detail" aria-label="Task workspace" tabindex="0"><title>Task workspace</title><rect x="34" y="780" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="800" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="827" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">06</tspan></text><text x="112" y="810" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Inspect linked task</tspan></text><text x="112" y="837" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Retain navigation to the parent task and report.</tspan></text></a><a href="../atlas.html#screen=followup" aria-label="Branch: Missing source, incomplete plan, or unmet prerequisite" tabindex="0"><title>Branch: Missing source, incomplete plan, or unmet prerequisite</title><rect x="34" y="906" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="929" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Prepare saved follow-up -&gt; Prepare saved follow-up</tspan></text><text x="52" y="953" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Missing source, incomplete plan, or unmet prerequisite</tspan></text></a><a href="../atlas.html#screen=feature-detail" aria-label="Branch: Feature requires a product decision" tabindex="0"><title>Branch: Feature requires a product decision</title><rect x="34" y="996" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1019" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Issues -&gt; Feature assessment</tspan></text><text x="52" y="1043" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Feature requires a product decision</tspan></text></a></svg>