<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1230" viewBox="0 0 1080 1230" role="group" aria-label="Review findings and prepare publication" style="font-family:Segoe UI,Arial,sans-serif"><title>Review findings and prepare publication</title><desc>Read a saved outcome, deliberately select feedback, inspect the exact payload, and review a known result. All data is illustrative.</desc><style>svg a{cursor:pointer}svg a:hover rect{stroke:#345EAD;stroke-width:2}svg a:focus{outline:none}svg a:focus-visible rect{stroke:#345EAD;stroke-width:4}svg text{pointer-events:none}</style><rect x="0" y="0" width="1080" height="1230" rx="0" fill="#FAF9FD" stroke="#D4DAE5"/><text x="34" y="34" fill="#505966" font-size="12" font-weight="600"><tspan x="34" dy="0">REVIEW JOURNEY / PUBLICATION</tspan></text><text x="34" y="72" fill="#1B1D24" font-size="28" font-weight="400"><tspan x="34" dy="0">Review findings and prepare publication</tspan></text><text x="34" y="104" fill="#505966" font-size="15" font-weight="400"><tspan x="34" dy="0">Read a saved outcome, deliberately select feedback, inspect the exact payload, and review a known result. All data</tspan><tspan x="34" dy="21">is illustrative.</tspan></text><a href="../atlas.html#screen=pull-requests" aria-label="Pull requests" tabindex="0"><title>Pull requests</title><rect x="34" y="150" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="170" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="197" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">01</tspan></text><text x="112" y="180" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Choose source</tspan></text><text x="112" y="207" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Capture the filtered review queue.</tspan></text></a><path d="M 70 250 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=pr-detail" aria-label="Pull request source" tabindex="0"><title>Pull request source</title><rect x="34" y="276" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="296" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="323" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">02</tspan></text><text x="112" y="306" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Understand outcome</tspan></text><text x="112" y="333" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Separate conclusion from validation and execution.</tspan></text></a><path d="M 70 376 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=report-detail" aria-label="Report reader" tabindex="0"><title>Report reader</title><rect x="34" y="402" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="422" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="449" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">03</tspan></text><text x="112" y="432" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Read findings</tspan></text><text x="112" y="459" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Inspect evidence and save private feedback.</tspan></text></a><path d="M 70 502 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=publication-select" aria-label="Select findings" tabindex="0"><title>Select findings</title><rect x="34" y="528" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="548" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="575" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">04</tspan></text><text x="112" y="558" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Select deliberately</tspan></text><text x="112" y="585" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">The action draft owns its own selection.</tspan></text></a><path d="M 70 628 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=publication-compose" aria-label="Compose publication" tabindex="0"><title>Compose publication</title><rect x="34" y="654" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="674" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="701" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">05</tspan></text><text x="112" y="684" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Compose</tspan></text><text x="112" y="711" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Review finding text and valid suggestions.</tspan></text></a><path d="M 70 754 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=publication-preview" aria-label="Exact action preview" tabindex="0"><title>Exact action preview</title><rect x="34" y="780" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="800" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="827" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">06</tspan></text><text x="112" y="810" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Inspect exact action</tspan></text><text x="112" y="837" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Execution needs a separate confirmation.</tspan></text></a><path d="M 70 880 v 19 l -4 -4 m 4 4 l 4 -4" fill="none" stroke="#737D8C" stroke-width="2"/><a href="../atlas.html#screen=action-receipt" aria-label="Action receipt" tabindex="0"><title>Action receipt</title><rect x="34" y="906" width="1006" height="99" rx="12" fill="#FFFFFF" stroke="#D4DAE5"/><rect x="50" y="926" width="42" height="42" rx="21" fill="#DCE6FF" stroke="#DCE6FF"/><text x="62" y="953" fill="#173D79" font-size="16" font-weight="600"><tspan x="62" dy="0">07</tspan></text><text x="112" y="936" fill="#1B1D24" font-size="19" font-weight="600"><tspan x="112" dy="0">Read receipt</tspan></text><text x="112" y="963" fill="#505966" font-size="14" font-weight="400"><tspan x="112" dy="0">Only an authoritative result establishes an outcome.</tspan></text></a><a href="../atlas.html#screen=unknown-outcome" aria-label="Branch: Confirmation result remains uncertain" tabindex="0"><title>Branch: Confirmation result remains uncertain</title><rect x="34" y="1032" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1055" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Exact action preview -&gt; Unconfirmed action outcome</tspan></text><text x="52" y="1079" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Confirmation result remains uncertain</tspan></text></a><a href="../atlas.html#screen=publication-select" aria-label="Branch: Revise the selected set" tabindex="0"><title>Branch: Revise the selected set</title><rect x="34" y="1122" width="1006" height="76" rx="12" fill="#FFF0D4" stroke="#E3CFA3"/><text x="52" y="1145" fill="#775000" font-size="13" font-weight="600"><tspan x="52" dy="0">Compose publication -&gt; Select findings</tspan></text><text x="52" y="1169" fill="#775000" font-size="14" font-weight="400"><tspan x="52" dy="0">Branch: Revise the selected set</tspan></text></a></svg>