      `${h.heading("My account", `${esc(account?.displayName || username)} · ${esc(username)}`)}${panel(`<h2 class="ar-title">Session and access</h2><div class="ar-grid">${kv("Repository scope", repositoryAccess(account?.repositories || ""))}${kv("Current access preset", badge(state.role, "info"))}${kv("Operational permissions", esc(account?.permissions.join(" · ") || "Read-only"))}${kv("Repository execution", account?.execution ? "Allowed for granted repositories" : "Not allowed")}${kv("Action capabilities", esc(account?.capabilities.join(" · ") || "No action capabilities"))}${kv("Account administration", account?.isAdmin ? "Granted independently" : "Not granted")}</div>`)}${panel(`<h2 class="ar-title">Change password</h2><p class="ar-small ar-muted">Changing your password ends this session and invalidates your other sessions.</p>${errorSlot}<form data-ops-form="password" data-ops-submit="ops:own-password" autocomplete="off" novalidate><div class="ar-grid">${passwordField("Current password", "ops-current-password", "current-password")}${passwordField("New password · 15–128 characters", "ops-own-password")}${passwordField("Confirm new password", "ops-own-confirm")}</div><p class="ar-small ar-muted">Use made-up values. Passwords stay in these fields only and are never stored or sent.</p>${row(`${btn("Discard password draft", "ops:own-password-discard")}${submitButton("Review password change", "ops:own-password")}`)}</form>`)}`,
    );
  }
  function login() {
    return `<div class="ar-signin">${h.heading("Sign in", "Agentic Review · local design prototype")}${O.loginNotice ? note(O.loginNotice, "info") : ""}${panel(`<form data-ops-form="login" data-ops-submit="ops:login" autocomplete="off" novalidate>${errorSlot}${h.field("Username", "ops-login-username", "", "text", 'data-ops="ephemeral.username" autocomplete="username" placeholder="demo.admin" autocapitalize="none" spellcheck="false"')}${passwordField("Password", "ops-login-password", "current-password")}${submitButton("Sign in to demo", "ops:login")}<p class="ar-small ar-muted">Choose demo.admin, demo.reviewer or demo.reader. Use any made-up password. There is no server connection.</p></form>`)}</div>`;
  }

  function render(page) {
    const pages = {
      comments,
      comment: comments,
      webhooks,
      webhook: webhooks,
      workers,
      worker: workers,
      repositories,
      repository: repositories,
      accounts,
      "account-edit": accounts,
      account: myAccount,
      login,
    };
    const collections = {
      comments: O.comments,
      webhooks: O.webhooks,
      workers: O.workers,
      repositories: O.repositories,
      accounts: O.accounts,
    };
    if (
      state.id &&
      collections[page] &&
      !(page === "accounts" && state.id === "new") &&
      !collections[page].some((record) => record.id === state.id)
    )
      return stack(
        `${back(page, page)}${h.empty("This record is unavailable", "The link does not match a record in this prototype. Return to the directory to continue.", btn("Back to directory", `ops:back:${page}`))}`,
      );
    return pages[page] ? pages[page]() : null;
  }

  function commentCommand(id, action, mode = "new") {
    const c = find(O.comments, id);
    O.commentCommands ||= {};
    const request = O.commentCommands[id];
    if (mode === "status" || mode === "replay") {
      if (!request) {
        ctx.toast("There is no retained publication request to inspect.");
        return;
      }
      request.state = "complete";
      request.message =
        mode === "status"
          ? `Saved request ${request.id} acknowledged. Delivery remains ${c.status}. This lookup did not submit a publication.`
          : `The same request ${request.id} was resent and deduplicated. Delivery remains ${c.status}; no second publication was created.`;
      addHistory(
        "comments",
        id,
        mode === "status" ? "Saved request status checked" : "Same request resent",
        c.status,
        request.message,
        request.id,
      );
    } else if (action === "check") {
      O.commentReadNotice ||= {};
      O.commentReadNotice[id] =
        `Delivery checked: ${c.status}. No publication was submitted; the saved request and its payload are unchanged.`;
      addHistory(
        "comments",
        id,
        "Delivery status checked",
        c.status,
        "Read-only snapshot; no new publication request.",
        request?.id || `fixture-initial-${id}`,
      );
    } else {
      O.requestCounter = (O.requestCounter || 0) + 1;
      const unknown = state.scenario === "unknown";
      O.commentCommands[id] = {
        id: `fixture-request-${id}-${O.requestCounter}`,
        action: "sync",
        state: unknown ? "unknown" : "complete",
        version: c.version,
        body: c.body,
        message: unknown
          ? "Publication request retained; acknowledgement is unknown. Resolve this request before creating another."
          : "Publication request accepted. Delivery is Pending; acceptance does not mean it was delivered.",
      };
      c.status = "Pending";
      c.updated = "Just now";
      if (O.commentReadNotice) delete O.commentReadNotice[id];
      addHistory(
        "comments",
        id,
        "Publication sync submitted",
        unknown ? "Acknowledgement unknown" : "Pending",
        O.commentCommands[id].message,
        O.commentCommands[id].id,
        {
          repository: repoName,
          target: `${c.kind} #${c.number}`,
          version: c.version,
          body: c.body,
        },
      );
    }
    refresh();
  }
  function webhookCommand(id, mode = "new") {
    const w = find(O.webhooks, id);
    O.webhookCommands ||= {};
    if (mode === "status" || mode === "replay") {
      const request = O.webhookCommands[id];
      if (!request) {
        ctx.toast("There is no retained recovery request to inspect.");
        return;
      }
      request.state = "complete";
      request.message =
        mode === "status"
          ? `Saved request ${request.id} acknowledged. Handling remains ${w.state}. No retry was scheduled by this status check.`
          : `The same request ${request.id} was resent and deduplicated. Handling remains ${w.state}; no second attempt was scheduled.`;
      addHistory(
        "webhooks",
        id,
        mode === "status" ? "Saved request status checked" : "Same request resent",
        w.state,
        request.message,
        request.id,
      );
    } else {
      const unknown = state.scenario === "unknown";
      O.requestCounter = (O.requestCounter || 0) + 1;
      w.attempt = (w.attempt || 1) + 1;
      O.webhookCommands[id] = {
        id: `fixture-recovery-${id}-${O.requestCounter}`,
        state: unknown ? "unknown" : "complete",
        attempt: w.attempt,
        message: unknown
          ? "Saved recovery request awaiting acknowledgement. Resolve the same request before retrying again."
          : "Recovery accepted. Event handling is scheduled; no existing Task was restarted.",
      };
      w.state = "Retry scheduled";
      w.reason = "Awaiting the next handling attempt";
      addHistory(
        "webhooks",
        id,
        `Handling attempt ${w.attempt} scheduled`,
        unknown ? "Acknowledgement unknown" : w.state,
        "No existing Task restarted. A later handling result is required.",
        O.webhookCommands[id].id,
        { event: w.id, repository: repoName, target: w.target, mode: w.mode, attempt: w.attempt },
      );
    }
    refresh();
  }

  function commentOutcome(id, outcome) {
    const c = find(O.comments, id),
      request = O.commentCommands?.[id];
    if (c.status !== "Pending" || request?.state === "unknown") {
      ctx.toast(
        "Only a pending publication with a resolved acknowledgement can receive a simulated result.",
      );
      return;
    }
    c.status = outcome === "success" ? "Delivered" : "Failed";
    c.updated = "Just now";
    const detail =
      outcome === "success"
        ? "Synthetic delivery completed. The retained exact body is marked Delivered; nothing was sent to GitHub."
        : "Synthetic delivery failed. The exact body and prior request remain available; review and submit a new sync when ready.";
    if (request) {
      request.result = c.status;
      request.message = detail;
    }
    if (O.commentReadNotice) delete O.commentReadNotice[id];
    addHistory(
      "comments",
      id,
      "Prototype delivery result received",
      c.status,
      detail,
      request?.id || `fixture-initial-${id}`,
    );
    refresh();
  }
  function webhookOutcome(id, outcome) {
    const w = find(O.webhooks, id),
      request = O.webhookCommands?.[id];
    if (w.state !== "Retry scheduled" || request?.state === "unknown") {
      ctx.toast(
        "Only a scheduled attempt with a resolved acknowledgement can receive a simulated result.",
      );
      return;
    }
    if (outcome === "success") {
      const routeId = String(w.number),
        taskExists = ctx.hasRecord?.("tasks", routeId) === true;
      if (!w.task && taskExists) {
        w.task = `task-${routeId}`;
        w.reusedTask = true;
      }
      const publication = O.comments.find((c) => c.task === w.task);
      if (!w.comment && publication) w.comment = publication.id;
      w.state = "Processed";
      w.phase = "Handling complete";
      w.reason = w.task
        ? "Synthetic handling completed. Existing local records are linked for inspection; no Task was created or restarted and no comment was published."
        : "Synthetic handling completed. This prototype has no corresponding local Task record; no Task or publication link is invented.";
    } else {
      w.state = "Failed";
      w.phase = "Source import";
      w.reason =
        "Synthetic source import failed again. Review this attempt and its retained request before scheduling another recovery.";
    }
    if (request) {
      request.result = w.state;
      request.message = w.reason;
    }
    addHistory(
      "webhooks",
      id,
      `Prototype result for attempt ${w.attempt || 1}`,
      w.state,
      w.reason,
      request?.id || `fixture-initial-${id}`,
    );
    refresh();
  }

  function handle(action, el) {
    if (!action.startsWith("ops:")) return false;
    const [_, key, id, arg] = action.split(":");
    const adminActions =
      /^(worker-(disable|confirm|enable|proof|reviewed)|global-save|account-(save|toggle|toggle-confirm|reset|reset-confirm|keep))$/;
    const needsFresh =
      /^(comment-(sync|confirm|review|reviewed)|webhook-(retry|confirm|review|reviewed)|worker-(disable|confirm|enable|proof|review|reviewed)|repo-(save|latest|keep|use-latest)|global-save|account-(save|toggle|toggle-confirm|reset|reset-confirm|latest|keep))$/;
    if (adminActions.test(key) && !allowAdmin()) {
      ctx.toast("This change requires account administration.");
      return true;
    }
    if (/^repo-(save|keep|use-latest)$/.test(key) && !allowRepo(id)) {
      ctx.toast("This change requires the exact repository grant and Manage repositories.");
      return true;
    }
    if (/^comment-(sync|confirm|replay|outcome)$/.test(key) && !allowSync()) {
      ctx.toast(
        "Publication requires this repository, Prepare actions, Execute actions and Comment capability.",
      );
      return true;
    }
    if (/^webhook-(retry|confirm|replay|status|outcome)$/.test(key) && !allowRecovery(id)) {
      ctx.toast(
        "Recovery requires this repository, Manage repositories and Create investigations; E2E also requires repository execution.",
      );
      return true;
    }
    if (["comment-check", "comment-status"].includes(key) && !allowPrepare()) {
      ctx.toast("Checking delivery requires Prepare actions for this repository.");
      return true;
    }
    if (needsFresh.test(key) && !fresh()) {
      ctx.toast(
        "Refresh successfully before submitting a new change. Your draft remains available.",
      );
      return true;
    }
    if (
      /^worker-(disable|confirm|enable)$/.test(key) &&
      state.scenario === "conflict" &&
      !O.workerReviewed?.[id]
    ) {
      ctx.toast("Review the current worker policy before changing admission.");
      return true;
    }
    if (
      [
        "account-toggle",
        "account-toggle-confirm",
        "account-reset",
        "account-reset-confirm",
      ].includes(key) &&
      state.scenario === "conflict" &&
      !O.accountReviewed?.[id]
    ) {
      ctx.toast("Compare the latest account access before making changes.");
      return true;
    }
    if (
      ["comment-sync", "comment-confirm", "comment-check"].includes(key) &&
      (O.commentCommands?.[id]?.state === "unknown" ||
        (state.scenario === "conflict" && !O.commentReviewed?.[id]))
    ) {
      ctx.toast("Resolve the retained request or review the current publication first.");
      return true;
    }
    if (
      ["comment-sync", "comment-confirm"].includes(key) &&
      find(O.comments, id).status === "Pending"
    ) {
      ctx.toast(
        "Wait for the pending delivery outcome before starting another publication request.",
      );
      return true;
    }
    if (
      ["webhook-retry", "webhook-confirm"].includes(key) &&
      (find(O.webhooks, id).state !== "Failed" ||
        O.webhookCommands?.[id]?.state === "unknown" ||
        (state.scenario === "conflict" && !O.webhookReviewed?.[id]))
    ) {
      ctx.toast("Only a reviewed failed event with no pending recovery can be retried.");
      return true;
    }
    switch (key) {
      case "dialog-close":
        ctx.closeDialog();
        break;
      case "open":
      case "nav":
        ctx.nav(
          id,
          arg && ["tasks", "reports"].includes(id)
            ? arg.replace(/^(task|report)-/, "")
            : arg || null,
        );
        break;
      case "back":
        ctx.nav(id, null);
        break;
      case "refresh":
        if (!fresh()) {
          ctx.toast(
            "Refresh failed. The last successful snapshot is retained; change the preview scenario to recover.",
          );
          break;
        }
        O.lastRefresh ||= {};
        O.lastRefresh[id] = new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        refresh();
        ctx.toast("Fixture snapshot refreshed.");
        break;
      case "filter-remove":
        if (Object.hasOwn(viewKeys[state.page] || {}, id)) {
          O[id] = "";
          viewChanged();
        }
        break;
      case "password-show": {
        const input = ctx.root.querySelector(`#${CSS.escape(String(id))}`);
        if (!input) break;
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        el ||= ctx.root.querySelector(`[data-action="${action}"]`);
        if (el) {
          el.textContent = show ? "Hide" : "Show";
          el.setAttribute("aria-pressed", String(show));
          el.setAttribute(
            "aria-label",
            `${show ? "Hide" : "Show"} ${input.getAttribute("aria-label") || input.closest("label")?.textContent.trim().split("\n")[0] || "password"}`,
          );
        }
        input.focus();
        break;
      }
      case "comment-filters":
        O.commentMore = !O.commentMore;
        viewChanged();
        break;
      case "comment-clear":
        O.commentKind =
          O.commentStatus =
          O.commentNumber =
          O.commentType =
          O.commentTask =
          O.commentSearch =
            "";
        state.q = "";
        viewChanged();
        break;
      case "comment-remove":
        if (Object.hasOwn(viewKeys.comments, id)) {
          O[id] = "";
          if (id === "commentSearch") state.q = "";
          viewChanged();
        }
        break;
      case "comment-check":
        commentCommand(id, "check");
        break;
      case "comment-review": {
        const c = find(O.comments, id);
        dialog(
          "Review current publication",
          stack(
            `${kv("Publication", esc(`${id} · current version v${c.version + 1}`))}${kv("Current delivery", badge(c.status))}<h2 class="ar-title">Current retained body</h2><pre style="white-space:pre-wrap;font:inherit">${esc(c.body)}</pre>${note("No comment is sent by reviewing this version. The next publication request will use this version and exact body.")}`,
          ),
          "I reviewed this version",
          `ops:comment-reviewed:${id}`,
        );
        break;
      }
      case "comment-reviewed": {
        const c = find(O.comments, id);
        c.version++;
        O.commentReviewed ||= {};
        O.commentReviewed[id] = true;
        ctx.closeDialog();
        refresh();
        break;
      }
      case "comment-status":
      case "comment-replay": {
        commentCommand(id, "sync", key === "comment-status" ? "status" : "replay");
        break;
      }
      case "comment-outcome":
        if (["success", "failure"].includes(arg)) commentOutcome(id, arg);
        break;
      case "comment-sync": {
        const c = find(O.comments, id);
        dialog(
          "Confirm publication sync",
          stack(
            `${note("This action can create or update one GitHub comment. In this prototype the action is simulated.", "warning")}${kv("Repository", esc(repoName))}${kv("Target", esc(`${c.kind} #${c.number}`))}${kv("Publication", esc(`${id} · version ${c.version}`))}<h3 class="ar-title">Exact body to publish</h3><pre style="white-space:pre-wrap;font:inherit">${esc(c.body)}</pre>`,
          ),
          "Sync this publication",
          `ops:comment-confirm:${id}`,
        );
        break;
      }
      case "comment-confirm":
        ctx.closeDialog();
        commentCommand(id, "sync");
        break;
      case "webhook-clear":
        O.webhookState = O.webhookSearch = O.webhookKind = O.webhookMode = O.webhookNumber = "";
        viewChanged();
        break;
      case "webhook-review": {
        const w = find(O.webhooks, id);
        dialog(
          "Review current event",
          stack(
            `${kv("Event", esc(`${id} · ${w.target}`))}${kv("Current handling state", badge(w.state))}${kv("Failed phase", esc(w.phase))}<p>${esc(w.reason)}</p>${note("Reviewing does not retry handling. Confirm this current state before scheduling another attempt.")}`,
          ),
          "I reviewed this event",
          `ops:webhook-reviewed:${id}`,
        );
        break;
      }
      case "webhook-reviewed":
        O.webhookReviewed ||= {};
        O.webhookReviewed[id] = true;
        ctx.closeDialog();
        refresh();
        break;
      case "webhook-status":
      case "webhook-replay":
        webhookCommand(id, key === "webhook-status" ? "status" : "replay");
        break;
      case "webhook-outcome":
        if (["success", "failure"].includes(arg)) webhookOutcome(id, arg);
        break;
      case "webhook-retry": {
        const w = find(O.webhooks, id);
        dialog(
          "Retry event handling",
          stack(
            `${kv("Event", esc(`${id} · ${w.event}`))}${kv("Repository / target", esc(`${repoName} · ${w.target}`))}${kv("Failed phase", esc(w.phase))}${note("This retries handling for the same event. It does not restart an existing Task. Successful handling may create a Task and configured automated replies. All effects are simulated here.")}`,
          ),
          "Retry this event",
          `ops:webhook-confirm:${id}`,
        );
        break;
      }
      case "webhook-confirm":
        ctx.closeDialog();
        webhookCommand(id);
        break;
      case "worker-clear":
        O.workerSearch = O.workerContact = O.workerCleanup = "";
        viewChanged();
        break;
      case "worker-review": {
        const w = find(O.workers, id);
        dialog(
          "Review current admission policy",
          stack(
            `${kv("Worker", esc(id))}${kv("Current server policy", badge(w.admission, "neutral"))}${kv("Current cleanup", badge(w.cleanup))}${kv("Saved version", `v${(w.version || 3) + 1}`)}${note("No admission change will be applied. Review this current policy, then choose whether to change it.")}`,
          ),
          "I reviewed the current policy",
          `ops:worker-reviewed:${id}`,
        );
        break;
      }
      case "worker-reviewed": {
        const w = find(O.workers, id);
        w.version = (w.version || 3) + 1;
        O.workerReviewed ||= {};
        O.workerReviewed[id] = true;
        ctx.closeDialog();
        refresh();
        break;
      }
      case "worker-disable": {
        const w = find(O.workers, id);
        dialog(
          "Disable E2E admission",
          stack(
            `${kv("Worker", esc(id))}${kv("Active E2E ownership", w.owner ? `Task ${esc(w.owner)}` : "No owner")}${note("This prevents new E2E work and requests cancellation of currently owned E2E work. Static task admission is unaffected. Existing E2E ownership requires a worker cleanup report before it is released.", "warning")}`,
          ),
          "Disable E2E admission",
          `ops:worker-confirm:${id}`,
          true,
        );
        break;
      }
      case "worker-confirm": {
        const w = find(O.workers, id);
        w.admission = "Disabled";
        w.version = (w.version || 3) + 1;
        w.cleanup = w.owner ? "Awaiting cleanup" : "No pending cleanup";
        w.effective = (w.advertised || []).filter((kind) => kind !== "PR E2E");
        if (w.owner)
          ctx.workerEvent?.({
            type: "admission-disabled",
            workerId: w.id,
            taskId: String(w.owner).replace(/^task-/, ""),
          });
        w.events ||= [];
        w.events.unshift([
          "Just now",
          "E2E admission disabled",
          w.owner
            ? "Owned E2E cancellation requested; awaiting cleanup report"
            : "No E2E ownership to release",
        ]);
        ctx.closeDialog();
        refresh();
        break;
      }
      case "worker-enable": {
        const w = find(O.workers, id);
        if (w.cleanup === "Awaiting cleanup" || !w.advertised?.includes("PR E2E")) {
          ctx.toast(
            "Wait for E2E capability and any pending cleanup report before enabling admission.",
          );
          break;
        }
        w.admission = "Enabled";
        w.version = (w.version || 3) + 1;
        w.effective = [...(w.advertised || [])];
        w.events ||= [];
        w.events.unshift([
          "Just now",
          "E2E task admission allowed",
          "Effective task types follow advertised capabilities",
        ]);
        refresh();
        break;
      }
      case "worker-cleanup": {
        const w = find(O.workers, id);
        ctx.openDialog(
          "Cleanup acknowledgement",
          stack(
            `${kv("Worker", esc(id))}${kv("State", badge(w.cleanup))}${kv("Last contact", esc(w.seen))}<p>The worker must report that its owned processes, desktop sessions and workspaces have been released.</p>${note("Refreshing the dashboard only updates the snapshot. It does not prove that cleanup completed.", "warning")}`,
          ),
          btn("Close", "ops:dialog-close"),
        );
        break;
      }
      case "worker-proof": {
        const w = find(O.workers, id);
        if (w.cleanup !== "Awaiting cleanup") {
          ctx.toast("This worker has no pending cleanup acknowledgement.");
          break;
        }
        if (w.owner)
          ctx.workerEvent?.({
            type: "cleanup-acknowledged",
            workerId: w.id,
            taskId: String(w.owner).replace(/^task-/, ""),
          });
        w.cleanup = "Complete";
        w.active = 0;
        w.owner = null;
        w.contact = "Recent contact";
        w.seen = "Just now";
        w.events ||= [];
        w.events.unshift([
          "Just now",
          "Synthetic E2E cleanup report received",
          `Owned E2E resources released; E2E admission remains ${w.admission === "Enabled" ? "allowed" : "off"}`,
        ]);
        refresh();
        break;
      }
      case "repo-tab":
        if (["overview", "intake", "replies", "scheduling"].includes(id)) setSection(id);
        break;
      case "repo-clear":
        O.repoSearch = "";
        viewChanged();
        break;
      case "repo-activity":
        (ctx.guardNavigation || ((fn) => fn()))(() => {
          state.repo = id;
          ctx.nav(arg, null);
        });
        break;
      case "repo-save": {
        const r = find(O.repositories, id),
          d = repoDraft(id);
        if (!repoChangeCount(id)) {
          clean();
          ctx.toast("No changes to save. The repository version is unchanged.");
          return true;
        }
        if ((d.static || d.e2e) && (!/^[1-9]\d*$/.test(d.reviewer.trim()) || !d.actors.trim())) {
          setSection("intake");
          focusError(
            "Enabled intake requires a numeric assignment recipient and at least one trusted actor.",
            !/^[1-9]\d*$/.test(d.reviewer.trim())
              ? `ops-repo-${id}-reviewer`
              : `ops-repo-${id}-actors`,
          );
          break;
        }
        if (
          d.actors.trim() &&
          d.actors
            .trim()
            .split(/[\s,]+/)
            .some((v) => !/^[1-9]\d*$/.test(v))
        ) {
          setSection("intake");
          focusError(
            "Trusted actor IDs must be positive numeric GitHub user IDs.",
            `ops-repo-${id}-actors`,
          );
          break;
        }
        if (d.progressEnabled && !d.autoRepliesEnabled) {
          setSection("replies");
          focusError(
            "Assignment progress comments require automatic replies to be enabled.",
            `ops-repo-${id}-autoRepliesEnabled`,
          );
          break;
        }
        let invalidTemplate = null;
        for (const [key, tokens] of Object.entries(replyTokens)) {
          const value =

    return `<p class="ar-publish-summary">${entries.length} selected findings · ${inline.length} inline suggestions · ${summary.length} summary findings</p><p><strong>Destination:</strong> ${reviewEvent ? "One GitHub review · " + reviewEvent : "One conversation comment"}</p><section class="ar-panel"><h3>${reviewEvent ? "Review summary" : "Conversation comment"}</h3><pre class="ar-publish-code">${esc(text || "(No summary text)")}</pre></section>${inline.map((e) => `<section class="ar-publish-preview-entry"><h3>Finding ${e.findingId} · ${esc(e.title)}</h3><p>${esc(e.assessment)} · ${esc(e.suggestion.path)}:${e.suggestion.startLine}–${e.suggestion.endLine}</p><p>${esc(e.body)}</p><pre class="ar-publish-code">${esc("```suggestion\n" + e.suggestion.replacement + "\n```")}</pre><p class="ar-small">Suggested change · author chooses whether to apply it · runtime not verified</p></section>`).join("")}<p class="ar-small">Only these selected findings will be published. Unselected findings and private report drafts are excluded.</p>`;

        at = shown.indexOf(id),

      $("ar-pub-query")?.focus();
      $("ar-pub-query")?.setSelectionRange(pos, pos);

      const top = $("ar-dialog-body").scrollTop;

      $("ar-dialog-body").scrollTop = top;

      choose();
      return;
    }
    if (command === "previous") {
      receipt(lastReceipt(item(), active), true);
      return;
    }
    if (command === "resume-draft") {
      reviewModes.includes(active) ? compose() : operation();
      return;
    }
    if (command === "choose-report") {
      choose({ fromReport: true });
      return;
    }
    if (command === "open") {
      open(arg);
      return;
    }
    if (command === "from-report") {
      open(arg, { fromReport: true });
      return;
    }
    if (command === "from-plan") {
      open("followup", { fromPlan: true });
      return;
    }

      render();

      return;
    }
    if (command === "open-source") {
      show(
        "Check source on GitHub",
        h.githubLink(item()) +
          notice("The source state alone does not prove this intent succeeded."),
        button("Back to receipt", "pub:check-view"),
      );
      return;
    }
    if (command === "check-view") {

      return;
    }
    if (command === "check") {
      const p = pendingIntent();

        receipt(p);
        return;
      }
      if (["close", "ci"].includes(p.operation)) {

          (p.operation === "close" ? "Closure" : "Workflow dispatch") +
            " audit is unresolved in this sample. No request was resent.",
        );
        return;
      }

        const task = ctx.createFollowup?.(p);

            "The saved task binding could not be restored. The original intent is retained.",

        }

      receipt(p);

    if (command !== "confirm" && !can("action:prepare")) return;

      importReportSelection();
      selection();
      return;
    }
    if (command === "keep-selection") {
      draft().reportSelectionBasis = reportSelectionKey();
      selection();
      return;
    }
    if (command === "selection") {
      selection();
      return;
    }
    if (command === "compose") {
      if (active === "request-changes" && !selected().length) {
        dialogError("Choose at least one finding to request changes.");
        return;
      }
      compose();
      return;
    }
    if (command === "remove") {
      const ids = selected().map((f) => f.id),
        at = ids.indexOf(Number(arg)),
        next = ids[at + 1] || ids[at - 1];
      draft().entries[arg].included = false;
      redrawInPlace(compose, next ? "#" + fieldId("text", next) : "#ar-pub-summary");
      return;
    }
    if (command === "latest" || command === "keep") {
      const f = all().find((f) => f.id === Number(arg)),
        e = draft().entries[arg];
      if (command === "latest") e.body = feedbackFor(f);
      e.reviewedBasis = feedbackFor(f);
      redrawInPlace(compose, "#" + fieldId("text", f.id));
      return;
    }
    if (command === "select-visible") {
      const d = draft();
      all()
        .filter(
          (f) =>
            (d.view !== "selected" || d.entries[f.id].included) &&
            (f.id + " " + f.title + " " + f.path + " " + f.status)
              .toLowerCase()
              .includes(d.q.toLowerCase()),
        )

    }

      Object.values(draft().entries).forEach((e) => {

      return;
    }

      preview();
      return;
    }
    if (command === "back") {
      reviewModes.includes(active) ? compose() : operation();
      return;
    }
    if (command === "confirm") {
      const p = state.preview;
      if (
        !p?.publisher ||
        !ownsIntent(p) ||
        p.status !== "prepared" ||
        !canExecute(p.operation) ||
        currentGuard(p.operation)

        return;
      if (state.scenario === "conflict") {
        p.status = "conflict";
        show(
          "Source or action guards changed",
          notice(
            "The prepared action is no longer current. Your selected findings and edits are retained; check the current source before preparing again.",
            "warning",
          ),
          button("Return to draft", "pub:back") + button("Close", "dialog-close"),
        );
        return;
      }
      if (state.scenario === "unknown") p.status = "unknown";
      else {
        if (p.operation === "followup") {
          const task = ctx.createFollowup?.(p);
          if (!task) {
            dialogError(
              "A follow-up Task could not be created from this saved source and plan. Your prepared payload is retained.",
            );
            return;
          }
          p.result = { taskId: task.id };
        }
        p.status = "simulated";
        if (["close", "merge"].includes(p.operation)) {
          state.publicationSourceStates ||= {};
          state.publicationSourceStates[sourceKey()] =
            p.operation === "close" ? "Closed" : "Merged";
        }
      }

  }
  return {
    open,
    choose,
    handle,
    change,
    receipt,
    lastReceipt,
    previewIntent,
    findingCard,
    sourceState,
    sourceBlock: (x = item()) =>
      sourceState(x) !== "Open" ? "This source is " + sourceState(x).toLowerCase() + "." : "",
  };
}

/* Independent queued follow-up Tasks. No Worker or repository operation is started. */
function createFollowupTasks(ctx) {
  "use strict";
  const { state, h, source } = ctx;
  const { esc, icon, button, badge, notice, heading, dt, githubLink } = h;
  const taskLabels = {
    "pr-verify": "PR verification",
    "issue-verify": "Issue verification",
    "reproduction-setup": "Reproduction setup",
    "issue-fix": "Issue fix",
    "feature-implement": "Feature implementation",
  };
  state.followupTasks ||= {};

  function find(id) {
    return Object.hasOwn(state.followupTasks, String(id)) ? state.followupTasks[String(id)] : null;
  }
  function list() {
    return Object.values(state.followupTasks).sort((left, right) => right.sequence - left.sequence);
  }
  function forSource(sourceId) {
    return list().filter((task) => task.sourceId === String(sourceId));
  }
  function latestForSource(sourceId) {
    return forSource(sourceId)[0] || null;
  }
  function create(intent) {
    if (!intent || typeof intent.id !== "string" || !intent.id) return null;
    const existing = list().find((task) => task.originIntent === intent.id);
    if (existing) return existing;
    const parent = source(String(intent.itemId || "")),
      payload = intent.payload,
      plan = payload?.planRef;
    if (
      !parent ||
      !["pulls", "issues"].includes(parent.type) ||
      payload?.kind !== "task" ||
      !Object.hasOwn(taskLabels, payload.taskKind) ||
      !/^[a-f0-9]{40}(?:[a-f0-9]{24})?$/i.test(payload.sourceCommit || "") ||
      !plan ||
      typeof plan.id !== "string" ||
      !plan.id ||
      !Number.isInteger(plan.version) ||
      plan.version < 1 ||
      !/^[a-f0-9]{64}$/i.test(plan.digest || "")
    )
      return null;
    if ((payload.taskKind === "pr-verify") !== (parent.type === "pulls")) return null;
    const sourceId = String(parent.id),
      suffix = intent.id.split("-").at(-1),
      id = "followup-" + sourceId + "-" + suffix;
    if (!/^[A-Za-z0-9_-]{1,64}$/.test(id) || find(id)) return null;
    const sequence = Math.max(0, ...list().map((task) => task.sequence)) + 1;
    const task = {
      id,
      sourceId,
      number: parent.number,
      repositoryFullName: parent.repositoryFullName,
      kind: parent.kind,
      type: parent.type,
      synthetic: parent.synthetic !== false,
      taskKind: payload.taskKind,
      title: taskLabels[payload.taskKind] + ": " + parent.title,
      sourceTitle: parent.title,
      status: "Queued",
      validation: "No accepted result yet",
      conclusion: "No saved report",
      latestReportRef: null,
      workerId: null,
      attempts: [],
      sourceCommit: payload.sourceCommit,
      expectedCommit: payload.sourceCommit,
      planRef: { id: plan.id, version: plan.version, digest: plan.digest },
      parentReportId: intent.reportRef?.id || "report-" + sourceId,
      parentTaskId: "task-" + sourceId,
      originIntent: intent.id,
      createdAt: new Date().toISOString(),
      sequence,
    };
    state.followupTasks[id] = task;
    return task;
  }
  function row(task) {
    const subject = (task.type === "issues" ? "Issue" : "PR") + " #" + task.number;
    return `<button type="button" id="ar-source-tasks-${esc(task.id)}" class="ar-source-row" data-action="open:tasks:${esc(task.id)}" aria-label="Open ${esc(taskLabels[task.taskKind] || "follow-up")} task for ${esc(subject)}"><span class="ar-source-main"><strong class="ar-source-title">${esc(task.title)}</strong><span class="ar-source-meta">${esc(subject)} · ${esc(task.repositoryFullName)} · ${esc(task.id)}</span></span><span class="ar-state">${badge(task.status, "info")}<span class="ar-small ar-muted">No saved report</span></span><span class="ar-validation ar-state"><span class="ar-small ar-muted">Validation</span>${badge("No accepted result yet", "neutral")}</span><span class="ar-chevron">${icon("chevron-right")}</span></button>`;
  }
  function detail(task) {
    const subject = (task.type === "issues" ? "Issue" : "PR") + " #" + task.number;
    const links =
      button("Open " + subject, "open:" + task.type + ":" + task.sourceId, "ghost small") +
      button("Open parent report", "open:reports:" + task.sourceId, "ghost small");
    const frozen = dt([
      ["Task", esc(task.id)],
      ["Task kind", esc(taskLabels[task.taskKind] || task.taskKind)],
      ["Source", esc(subject + " · " + task.repositoryFullName)],
      ["Exact source commit", `<code>${esc(task.sourceCommit)}</code>`],
      ["Saved plan", esc(task.planRef.id + " · v" + task.planRef.version)],
      ["Plan digest", `<code>${esc(task.planRef.digest)}</code>`],
      ["Parent report", esc(task.parentReportId)],
      ["Parent task", esc(task.parentTaskId)],
      ["Origin intent", esc(task.originIntent)],
      ["Created", esc(task.createdAt)],
    ]);
    return (
      `<div class="ar-back">${button(icon("arrow-left") + " Back to tasks", "page:tasks", "ghost small")}</div><div class="ar-kicker">Linked follow-up · ${esc(subject)}</div>` +
      heading(task.title, esc(task.id + " · " + task.repositoryFullName), githubLink(task)) +
      `<div class="ar-stack"><section class="ar-task-progress ar-panel"><div class="ar-row"><h2>Follow-up queued</h2>${badge(task.status, "info")}</div><p>The confirmed plan is retained in an independent synthetic Task. No Worker has started it.</p><p><strong>Next step:</strong> Wait for Worker admission and a recorded execution attempt. This prototype keeps the Task queued.</p>${notice("No execution output, new report or accepted validation result is available. The parent Task and its saved report are unchanged.")}<div class="ar-row">${links}</div></section><section class="ar-panel"><h2>Progress</h2>${dt(
        [
          ["Queue", "Queued in this prototype"],
          ["Worker", "Not assigned"],
          ["Attempts", "None started"],
          ["Execution output", "Not available yet"],
          ["Validation", "No accepted result yet"],
          ["New report", "Not available yet"],
        ],
      )}</section><details class="ar-panel"><summary>Details · frozen plan and source</summary>${frozen}</details></div>`
    );
  }
  return { create, find, list, forSource, latestForSource, row, detail };
}

          `<h3>${feature ? "Draft: selective Settings export" : bug ? "Verify the reported Settings startup failure" : "Verify cancellation and saved configuration"}</h3><ol>${feature ? "<li>Resolve dependency and import compatibility decisions with maintainers.</li><li>Record accepted behavior for omitted settings and defaults.</li><li>Implement only after the decisions are recorded.</li><li>Verify selective export and existing import compatibility.</li>" : bug ? "<li>Choose the exact commit and record the update environment.</li><li>Follow the reported update and Settings launch steps.</li><li>Record whether the window exits, with logs and available evidence.</li><li>Report reproduced, not reproduced or blocked; confirm cleanup.</li>" : "<li>Prepare the exact saved source.</li><li>Exercise cancellation during migration.</li><li>Record the persisted settings and actual checks.</li><li>Confirm application cleanup.</li>"}</ol>` +
            notice(
              feature
                ? "This is a draft plan. Maintainer decisions and acceptance are still pending."
                : "The plan is saved, but execution still needs source, permissions and Worker capacity.",
            ) +
            (prepareOperationReason("followup")
              ? notice(prepareOperationReason("followup"), "warning")
              : "") +
            field(
              "Chosen full commit SHA",
              "ar-plan-sha",
              d.sha,
              "text",
              prepareOperationReason("followup") ? "readonly" : "",
            ),
          button("Close", "dialog-close") +
            button(
              "Review prerequisites",
              "plan-prerequisites",
              "primary",
              prepareOperationReason("followup") ? "disabled" : "",
            ),
        );
        coreForm = { kind: "followup", key: sourceKey(), initial: { ...d } };
        break;
      }
      case "plan-prerequisites": {
        const permissionReason = prepareOperationReason("followup");
        if (permissionReason) {
          dialogError(permissionReason);
          break;
        }
        const sha = inputValue("ar-plan-sha").trim();
        if (!/^[a-f0-9]{40}(?:[a-f0-9]{24})?$/i.test(sha)) {
          dialogError("Enter the full source commit SHA.", "ar-plan-sha");
          break;
        }
        Object.assign(actionDraft(), { sha, operation: "followup" });
        openDialog(
          "Follow-up prerequisites",
          notice("Source chosen. A saved plan does not by itself authorize execution.") +
            dt([
              ["Saved plan", "Available"],
              ["Exact source", sha],
              [
                "Execution permission",
                currentAccount()?.execution ? "Granted in sample account" : "Not granted",
              ],
              ["Worker admission", "Needs fresh server check"],
              ["Current guards", "Pending authoritative preparation"],
            ]),
          button("Close", "dialog-close") +
            button(
              "Open preparation",
              "pub:from-plan",
              "primary",
              !can("action:prepare") ? "disabled" : "",
            ),
        );
        break;
      }
      case "journeys":
        showJourneys();
        break;
      case "search":
        guardNavigation(searchDialog);
        break;
    }
  }
  root.addEventListener("click", (e) => {
    const link = e.target.closest('a[href^="#"]');
    if (link) {
      const id = link.getAttribute("href").slice(1),
        fieldTarget = /^[A-Za-z0-9_.:-]+$/.test(id) ? $(id) : null;
      if (fieldTarget && ["INPUT", "TEXTAREA", "SELECT"].includes(fieldTarget.tagName)) {
        e.preventDefault();
        fieldTarget.focus();
        return;
      }
    }
    const target = e.target.closest("[data-action]");
    if (target && root.contains(target) && !target.disabled) handle(target.dataset.action, target);
  });
  root.addEventListener("submit", (e) => {
    const form = e.target.closest("form[data-ops-submit]");
    if (form) {
      e.preventDefault();
      ops.handle(form.dataset.opsSubmit, form);
    }
  });
  root.addEventListener("input", (e) => {
    const el = e.target;
    clearFieldError(el);
    if (el.dataset.pub) {
      if (!["include", "view", "delivery", "reason", "method"].includes(el.dataset.pub))
        publication.change(el);
      return;
    }
    if (el.closest("#ar-dialog-body") && el.dataset.ops?.startsWith("ephemeral."))
      dialogDirty = Array.from(
        $("ar-dialog-body").querySelectorAll('[data-ops^="ephemeral."]'),
      ).some((input) => (input.type === "checkbox" ? input.checked : Boolean(input.value)));
    if (el.id === "ar-list-search") {
      currentList().q = textParam(el.value);
      currentList().page = 1;
      retainInputRender(el, render);
    } else if (el.id === "ar-finding-search") {
      state.findingQuery = textParam(el.value);
      state.findingPage = 1;
      retainInputRender(el, render);
    } else if (el.id === "ar-feedback") {
      if (can("action:prepare")) {
        state.drafts[item().id + ":" + state.finding] = el.value;
        updateDirty();
        const discard = root.querySelector('[data-action="discard-drafts"]');
        if (discard)
          discard.disabled = !Object.keys(state.drafts).some(
            (key) => key.startsWith(item().id + ":") && isDraftChanged(key),
          );
        if ($("ar-draft-state"))
          $("ar-draft-state").textContent = state.reportDirty
            ? "Unsaved feedback edits"
            : "Feedback up to date";
      }
    } else if (el.id === "ar-output-search") {
      state.taskOutputQuery = textParam(el.value);
      retainInputRender(el, render);
    } else if (trackCoreInput(el)) {
    } else if (el.id === "ar-global-search") {
      const q = el.value.toLowerCase().trim();
      $("ar-global-results").innerHTML = !canReadSource()
        ? empty(
            "Repository access required",
            "There are no searchable source records in this account’s current grants.",
          )
        : q.length < 2
          ? '<p class="ar-muted">Enter at least two characters.</p>'
          : fixtures
              .filter((x) => (x.title + " " + x.id).toLowerCase().includes(q))
              .map(
                (x) =>
                  `<div class="ar-row" style="margin-bottom:10px">${button("#" + x.id + " · " + esc(x.title), "open:" + x.type + ":" + x.id, "ghost")}${hasRecord("tasks", x.id) ? button("Task", "open:tasks:" + x.id, "small") : ""}${reportSnapshots[x.id] ? button("Report", "open:reports:" + x.id, "small") : ""}</div>`,
              )
              .join("") || empty("No matching results", "Try a source number or title.");
    } else ops.change(el);
  });
  root.addEventListener("change", (e) => {
    const el = e.target;
    clearFieldError(el);
    if (el.dataset.pub) {
      if (["include", "view", "delivery", "reason", "method"].includes(el.dataset.pub))
        publication.change(el);
      return;
    }
    if (el.id === "ar-role") {
      const role = el.value,
        account = state.ops.accounts?.find(
          (a) =>
            a.id ===
            { admin: "acct-admin", preparer: "acct-reviewer", reader: "acct-reader" }[role],
        );
      if (!account?.enabled) {
        el.value = state.role;
        toast("This sample account is disabled. Choose an enabled account.");
        return;
      }
      guardNavigation(() => {
        clearPrivateSession();
        state.role = role;
        render();
      });
    } else if (el.id === "ar-scenario") {
      const scenario = el.value;
      guardNavigation(() => {
        state.scenario = scenario;
        render();
      });
    } else if (el.id === "ar-repo") {
      const repo = el.value;
      guardNavigation(() => {
        saveRecordView();
        state.repo = enumParam(repo, ["all", "fixture", "fork"], "all");
        state.id = null;
        state.queue = null;
        state.viewEpoch++;
        currentList().page = 1;
        delete currentList().opener;
        syncRoute();
        render();
      });
    } else if (el.id === "ar-source-state") {
      currentList().source = el.value;
      currentList().page = 1;
      render();
    } else if (el.id === "ar-report-completeness") {
      currentList().status = el.value;
      currentList().page = 1;
      render();
    } else if (el.id === "ar-report-type") {
      currentList().type = el.value;
      currentList().page = 1;
      render();
    } else if (el.id === "ar-report-delivery") {
      currentList().delivery = el.value;
      currentList().page = 1;
      render();
    } else if (el.id === "ar-start-mode") {
      trackCoreInput(el);
      $("ar-start-sha-wrap").hidden = el.value !== "source";
    } else if (el.id === "ar-priority") {
      state.severity = el.value;
      state.findingPage = 1;
      render();
    } else if (el.id === "ar-finding-status") {
      state.findingStatus = el.value;
      state.findingPage = 1;
      render();
    } else if (el.id === "ar-finding-picker") {
      state.finding = intParam(el.value);
      render();
    } else if (el.id === "ar-selected-finding") {
      if (!can("action:prepare")) return;
      const id = item().id;
      state.selected[id] = el.checked
        ? [...new Set([...(state.selected[id] || []), state.finding])]
        : (state.selected[id] || []).filter((f) => f !== state.finding);
      render();
    } else if (el.id === "ar-event-type") {
      state.eventType = el.value;
      render();
    } else if (el.id === "ar-attempt") {
      state.attempt = String(
        intParam(el.value, attemptCounts[item().id] || 1, attemptCounts[item().id] || 1),
      );
      render();
    } else if (el.id === "ar-operation") {
      captureActionDraft();
      dialogDirty = true;
      operationOptions();
    } else if (trackCoreInput(el)) {
    } else ops.change(el);
  });
  $("ar-dialog").addEventListener("cancel", (e) => {
    e.preventDefault();
    if ($("ar-dialog-title").textContent === "Leave unsaved changes?") handle("guard-stay");
    else handle("dialog-close");
  });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if ($("ar-dialog-title").textContent !== "Leave unsaved changes?" || !$("ar-dialog").open)
        guardNavigation(searchDialog);
    } else if (
      e.key === "Enter" &&
      !e.isComposing &&
      $("ar-dialog").open &&
      e.target.matches('input:not([type="checkbox"]):not([type="radio"])') &&
      !e.target.closest("form")
    ) {
      const submit =
        {
          start: "start-submit",
          resume: "resume-submit",
          prepare: "prepare-submit",
          followup: "plan-prerequisites",
        }[coreForm?.kind] || (e.target.id === "ar-import-url" ? "import-submit" : null);
      if (submit) {
        e.preventDefault();
        handle(submit, e.target);
      }
    }
  });
  window.addEventListener("popstate", (e) => {
    if (historyTraversal) {
      const transition = historyTraversal,
        position = e.state?.arPosition;
      if (transition.phase === "return" && position === transition.from) {
        historyTraversal = null;
        transition.returned = true;
        if (transition.approved && !transition.cancelled) {
          transition.phase = "target";
          historyTraversal = transition;
          history.go(-transition.delta);
        }
        return;
      }
      if (transition.phase === "target" && position === transition.to) {
        historyTraversal = null;
        transition.apply();
        return;
      }
      // A different browser navigation supersedes this transfer; process its actual entry.
      transition.cancelled = true;
      historyTraversal = null;
    }
    const next = parseView(e.state?.ar?.hash || location.hash),
      position = Number.isInteger(e.state?.arPosition) ? e.state.arPosition : routePosition,
      delta = routePosition - position,
      scroll = Number.isFinite(e.state?.arScroll)
        ? Math.max(0, Math.min(10000000, e.state.arScroll))
        : 0;
    const apply = () => {
      const opener =
        e.state?.arViewEpoch === state.viewEpoch ? listOpener(e.state?.arOpener, next.page) : null;
      applyView(next, { queue: e.state?.arQueue, scroll, opener });
      routePosition = position;
      if ($("ar-dialog").open) closeDialog();
      const restoreList = !state.id && corePages.includes(state.page);
      render({ deferFocus: restoreList });
      restoreScroll(scroll, { restoreList, opener });
    };
    if (state.dirty || dialogDirty) {
      // Put the browser back on the visible route while the user decides.
      if (delta) {
        const transition = {
          phase: "return",
          from: routePosition,
          to: position,
          delta,
          apply,
          returned: false,
          approved: false,
          cancelled: false,
        };
        historyTraversal = transition;
        history.go(delta);
        guardNavigation(() => {
          transition.approved = true;
          if (transition.returned && !transition.cancelled) {
            transition.phase = "target";
            historyTraversal = transition;
            history.go(-delta);
          }
        });
      } else {
        syncRoute(true);
        guardNavigation(() => {
          apply();
          syncRoute(true);
        });
      }
    } else apply();
  });
  window.addEventListener("hashchange", () => {
    if (historyTraversal || location.hash === routeSnapshot().hash) return;
    const next = parseView(location.hash),
      apply = () => {
        applyView(next);
        if ($("ar-dialog").open) closeDialog();
        syncRoute(true);
        render();
        restoreScroll();
      };
    if (state.dirty || dialogDirty) {
      syncRoute(true);
      guardNavigation(apply);
    } else apply();
  });
  let scrollFramePending = false;
  window.addEventListener(
    "scroll",
    () => {
      if (scrollFramePending) return;
      scrollFramePending = true;
      requestAnimationFrame(() => {
        scrollFramePending = false;
        const route = routeSnapshot();
        if (history.state?.ar?.hash === route.hash && location.hash === route.hash) {
          if (!state.id) currentList().scroll = window.scrollY;
          try {
            history.replaceState(
              { ...history.state, arScroll: Math.max(0, Math.min(10000000, window.scrollY)) },
              "",
              route.hash,
            );
          } catch {}
        }
      });
    },
    { passive: true },
  );
  try {
    applyView(parseView(location.hash));
  } catch {}
  render();
  syncRoute(true);
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: render });
    tweak.addToggle(design, "compact", { label: "Compact source rows" });
    tweak.addToggle(design, "expanded", { label: "Expanded navigation labels" });
    tweak.addToggle(design, "validation", { label: "Validation column in lists" });
  }
})();

</script>
